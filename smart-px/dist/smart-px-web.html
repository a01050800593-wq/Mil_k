<title>스마트 PX 시연</title>
<style>
/* 스마트 PX 시연 — 빔프로젝터 가독성을 위해 밝은 테마, 큰 글자 */
:root {
  --bg: #e8ede9; --ink: #1b2520; --muted: #6a746e; --line: #dce3de; --card: #fff; --soft: #f4f7f5;
  --brand: #2c5a4a; --brand2: #3b7862; --brand-soft: #e1eee8;
  --accent: #f0a500; --danger: #cf4040; --ok: #2c9a57; --info: #2f6bd1; --amber: #b97700;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { box-sizing: border-box; color-scheme: light; } /* claude.ai가 넣는 안전 영역 패딩을 높이에 포함 */
body {
  font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
h1, h2, h3, h4, p { margin: 0; }
small { font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.center { text-align: center; }
.mono { font-family: Consolas, 'D2Coding', monospace; font-size: 12.5px; }
.pad { padding: 14px 4px; }
.mt8 { margin-top: 8px; }
.link { background: none; border: 0; padding: 0; color: var(--info); font-size: 12px; text-decoration: underline; }
.logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), #ffcf4d); color: #2a2100; font-weight: 900; display: grid; place-items: center; font-size: 15px; flex: none; letter-spacing: -.5px; }
.logo.lg { width: 72px; height: 72px; border-radius: 20px; font-size: 28px; margin: 0 auto 12px; box-shadow: 0 8px 20px rgba(240,165,0,.35); }

/* ---------- 버튼·입력 ---------- */
.btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, transform .05s; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--brand2); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger-ghost { color: var(--danger); border-color: #f0c9c9; background: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.on { background: var(--brand-soft); border-color: var(--brand2); color: var(--brand); }
.btn.block { width: 100%; margin-top: 8px; }
.btn.lg { padding: 13px 16px; font-size: 15.5px; border-radius: 12px; }
.btn.sm { padding: 7px 10px; font-size: 13px; }
.btn.xs { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.finput, .fsel { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; background: #fff; color: var(--ink); }
.finput:focus, .fsel:focus { outline: 2px solid var(--brand2); outline-offset: -1px; }
.finput.sm { width: 220px; padding: 8px 12px; }
.flabel { display: block; font-size: 12.5px; font-weight: 700; color: #3b4741; margin: 14px 0 6px; }
.flabel small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.err { color: var(--danger); background: #fdecec; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }
.note { font-size: 12.5px; color: #4c5852; background: var(--soft); border-radius: 10px; padding: 9px 11px; margin-top: 10px; }

/* ---------- 상단 시연 바 ---------- */
#topbar { flex: none; height: 62px; display: flex; align-items: center; gap: 18px; padding: 0 18px; background: var(--brand); color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); z-index: 5; }
.tb-brand { display: flex; align-items: center; gap: 10px; }
.tb-brand b { display: block; font-size: 16px; }
.tb-brand small { opacity: .75; }
.tb-modes { display: flex; background: rgba(0,0,0,.2); border-radius: 12px; padding: 4px; }
.tb-modes button { border: 0; background: none; color: rgba(255,255,255,.8); padding: 8px 14px; border-radius: 9px; font-weight: 600; }
.tb-modes button.on { background: #fff; color: var(--brand); }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-clock { text-align: right; margin-right: 6px; }
.tb-clock small { display: block; opacity: .7; font-size: 11px; }
.tb-clock b { font-size: 17px; font-variant-numeric: tabular-nums; }
.tb-btn { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #fff; padding: 8px 12px; border-radius: 9px; font-weight: 600; white-space: nowrap; }
.tb-btn:hover { background: rgba(255,255,255,.18); }
.tb-btn.reset.armed { background: var(--danger); border-color: var(--danger); }

/* ---------- 무대 레이아웃 ---------- */
#stage { flex: 1; min-height: 0; display: flex; }
#soldierPane { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 36px; padding: 14px; }
#adminPane { flex: 1; min-width: 0; display: none; }
body[data-mode="admin"] #soldierPane { display: none; }
body[data-mode="admin"] #adminPane, body[data-mode="split"] #adminPane { display: block; }
body[data-mode="split"] #soldierPane { flex: none; width: 430px; border-right: 1px solid var(--line); }
body[data-mode="split"] #guide { display: none; }

/* ---------- 시연 가이드 ---------- */
.guide { width: 300px; background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.06); align-self: center; }
.guide h3 { font-size: 16px; margin-bottom: 12px; }
.g-steps { list-style: none; padding: 0; margin: 0 0 14px; }
.g-steps li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.g-steps li i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); border: 1px solid var(--line); font-style: normal; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.g-steps li b { display: block; font-size: 13.5px; }
.g-steps li small { color: var(--muted); }
.g-steps li.done i { background: var(--ok); border-color: var(--ok); color: #fff; }
.g-steps li.done b { color: var(--ok); }
.g-box { background: var(--soft); border-radius: 12px; padding: 12px; font-size: 12.5px; }
.g-box ul { margin: 6px 0 0; padding-left: 18px; }
.g-tip { margin-top: 12px; font-size: 12.5px; color: #5a4300; background: #fff6dd; border-radius: 12px; padding: 10px 12px; }

/* ---------- 스마트폰 프레임 ---------- */
.phone { flex: none; width: 392px; height: min(830px, calc(100vh - 90px)); background: #121614; border-radius: 48px; padding: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.28), inset 0 0 0 2px #333; }
.phone-screen { position: relative; width: 100%; height: 100%; background: #f5f7f5; border-radius: 37px; overflow: hidden; }
#phoneApp { height: 100%; }
.p-app { height: 100%; display: flex; flex-direction: column; position: relative; }
.p-status { flex: none; height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 4px 26px 0; font-size: 12.5px; background: #fff; }
.p-body { flex: 1; min-height: 0; overflow-y: auto; position: relative; scrollbar-width: thin; }
.p-pad { padding: 12px 16px 20px; }
.p-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 6px; background: #fff; }
.p-hello { font-size: 18px; font-weight: 800; }
.p-sub { font-size: 12px; color: var(--muted); }
.p-icons { display: flex; gap: 4px; }
.icon-btn { position: relative; border: 0; background: var(--soft); width: 40px; height: 40px; border-radius: 12px; font-size: 18px; display: grid; place-items: center; }
.icon-btn i, .p-nav i, .a-side nav i { position: absolute; top: -4px; right: -6px; background: var(--danger); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 800; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
.p-banner { margin: 8px 16px 0; background: linear-gradient(120deg, #23463a, #3b7862); color: #fff; border-radius: 14px; padding: 12px 14px; }
.p-banner b { display: block; font-size: 14.5px; }
.p-banner span { font-size: 12px; opacity: .85; }
.p-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px 2px; }
.chip { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; }
.p-cats { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; background: #f5f7f5; z-index: 2; }
.p-cats button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.p-cats button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 2px 16px 20px; }
.pcard { background: #fff; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.pcard.soldout { opacity: .55; }
.pimg { position: relative; height: 96px; border-radius: 12px; display: grid; place-items: center; }
.pimg > span { font-size: 46px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.12)); }
.bdgs { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.bdg { display: inline-block; font-size: 10.5px; font-weight: 800; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.bdg.pick { background: #3d3d8f; color: #fff; }
.bdg.sale { background: var(--danger); color: #fff; }
.bdg.out { background: #555; color: #fff; }
.pname { font-size: 13.5px; font-weight: 700; margin: 8px 2px 2px; min-height: 20px; }
.pprice { margin: 0 2px; font-size: 14px; }
.pprice s { color: var(--muted); font-size: 11.5px; margin-right: 4px; }
.pprice b.sale, b.sale { color: var(--danger); }
.pmeta { font-size: 11.5px; color: var(--muted); margin: 2px 2px 6px; }
.pmeta.few { color: var(--amber); font-weight: 700; }
.pcard .btn { margin-top: auto; }
.stepper { display: flex; align-items: center; justify-content: space-between; background: var(--brand-soft); border-radius: 10px; padding: 3px; min-width: 96px; }
.stepper button { width: 30px; height: 28px; border: 0; background: #fff; border-radius: 8px; font-size: 16px; font-weight: 700; color: var(--brand); }
.stepper b { font-size: 14px; min-width: 22px; text-align: center; }
.pcard .stepper { margin-top: auto; }
.p-nav { flex: none; display: flex; border-top: 1px solid var(--line); background: #fff; padding: 6px 4px 12px; }
.p-nav button { flex: 1; border: 0; background: none; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.p-nav button span { position: relative; font-size: 20px; filter: grayscale(1); opacity: .7; }
.p-nav button.on { color: var(--brand); font-weight: 800; }
.p-nav button.on span { filter: none; opacity: 1; }
.p-subhead { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; }
.p-subhead b { text-align: center; font-size: 16px; }
.p-subhead .icon-btn { font-size: 26px; background: none; }
.p-cta { position: sticky; bottom: 0; padding: 10px 16px 12px; background: linear-gradient(transparent, #f5f7f5 30%); }
.p-cta .btn { margin-top: 0; }
.sec { font-size: 14px; margin: 18px 0 8px; }
.sec small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty-ico { font-size: 48px; margin-bottom: 8px; }
.empty .btn { margin-top: 14px; }

/* 로그인 */
.p-login { padding: 30px 24px; background: #fff; }
.login-hero { text-align: center; margin: 12px 0 18px; }
.login-hero h1 { font-size: 24px; }
.login-hero p { color: var(--muted); font-size: 13px; }
.samples { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.samples-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.sample { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 8px 10px; margin-top: 6px; text-align: left; font-size: 12.5px; }
.sample small { color: var(--muted); font-family: Consolas, monospace; }
.fine { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 14px; }

/* 장바구니 */
.cline { display: flex; gap: 10px; background: #fff; border-radius: 14px; padding: 10px; margin-bottom: 8px; }
.cimg { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 28px; flex: none; }
.cinfo { flex: 1; min-width: 0; }
.cname { font-weight: 700; font-size: 13.5px; }
.cprice { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; }
.cprice b { color: var(--ink); }
.cctl { display: flex; align-items: center; justify-content: space-between; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 8px; text-align: center; }
.seg button b { display: block; font-size: 14.5px; }
.seg button small { color: var(--muted); }
.seg button.on { border-color: var(--brand); background: var(--brand-soft); }
.rounds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.round { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 4px; }
.round b { display: block; font-size: 13px; }
.round small { color: var(--muted); font-size: 11px; }
.round.on { border-color: var(--brand); background: var(--brand-soft); }
.round:disabled { background: #f0f0f0; text-decoration: line-through; }
.warnbox { margin-top: 12px; background: #fff7e3; border: 1px solid #f3d58c; border-radius: 12px; padding: 12px; }
.warnbox b { color: #7a5200; }
.warnbox p { font-size: 12.5px; margin-top: 4px; }
.warnbox .flabel { margin-top: 10px; }
.sumbox { background: #fff; border-radius: 14px; padding: 4px 12px; }
.sumrow { padding: 10px 0; border-bottom: 1px solid var(--line); }
.sumrow small { display: block; color: var(--muted); margin-top: 2px; }
.sumrow small.items { color: #3b4741; }
.sumtop { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; }
.sumtotal { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
.sumtotal b { font-size: 18px; color: var(--brand); }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: #eee; }
.tag.shuttle { background: #e3edff; color: #2650a8; }
.tag.pickup { background: #fff0d9; color: #8a5600; }
.tag.mobile { background: #e9e3ff; color: #5130a8; }

/* 결제 */
.paym { width: 100%; display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 8px; text-align: left; }
.paym.on { border-color: var(--brand); background: var(--brand-soft); }
.paym-ico { font-size: 26px; }
.paym-txt { flex: 1; }
.paym-txt b { display: block; }
.paym-txt small { color: var(--muted); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); }
.paym.on .radio { border: 6px solid var(--brand); }
.paying { padding: 120px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.paying small { color: var(--muted); }
.spinner { width: 52px; height: 52px; border-radius: 50%; border: 5px solid var(--brand-soft); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.done-ico { font-size: 54px; margin: 10px 0 4px; }
.qrcard { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 14px; padding: 10px; margin: 12px 0; text-align: left; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.qrcard .qr { width: 110px; height: 110px; flex: none; }
.qrcard b { display: block; font-family: Consolas, monospace; }
.qrcard small { display: block; color: var(--muted); }

/* 내 주문 */
.ocard { background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 10px; border: 2px solid transparent; }
.ocard.ready { border-color: var(--ok); box-shadow: 0 4px 16px rgba(44,154,87,.18); }
.ocard.cancelled { opacity: .55; }
.ohead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.ohead b { font-family: Consolas, monospace; }
.oitems { font-size: 13px; margin: 6px 0 4px; }
.ometa { font-size: 12px; color: var(--muted); }
.oready { margin-top: 8px; background: #e6f6ec; color: #1d6b3d; font-weight: 700; font-size: 12.5px; border-radius: 10px; padding: 8px 10px; }
.oacts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.steps { display: flex; margin: 12px 0 2px; }
.step { flex: 1; text-align: center; position: relative; font-size: 10.5px; color: #9aa39e; }
.step i { display: block; width: 12px; height: 12px; border-radius: 50%; background: #dfe5e1; margin: 0 auto 4px; position: relative; z-index: 1; }
.step::before { content: ''; position: absolute; top: 5px; left: -50%; right: 50%; height: 2px; background: #dfe5e1; }
.step:first-child::before { display: none; }
.step.done i, .step.cur i { background: var(--brand); }
.step.done::before, .step.cur::before { background: var(--brand); }
.step.cur { color: var(--brand); font-weight: 800; }
.step.cur i { box-shadow: 0 0 0 4px rgba(44,90,74,.2); }
.step.done { color: var(--ink); }
.sbadge { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
.b-gray { background: #eceeed; color: #555; }
.b-blue { background: #e2ebff; color: #2650a8; }
.b-amber { background: #fff0d1; color: #8a5600; }
.b-green { background: #dff4e6; color: #1d6b3d; }
.b-done { background: #e8efe9; color: #3b5a4a; }
.b-red { background: #fde3e3; color: #a52a2a; }

/* 휴대폰 안 모달·토스트 */
.p-modal { position: absolute; inset: 0; background: rgba(10,20,15,.45); display: flex; align-items: flex-end; z-index: 20; animation: fade .15s; }
.p-sheet { width: 100%; max-height: 88%; overflow-y: auto; background: #fff; border-radius: 22px 22px 0 0; padding: 14px 18px 22px; animation: up .2s ease-out; }
.p-sheet.tall { max-height: 94%; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sheet-head b { font-size: 16px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.qr-big { position: relative; width: 230px; margin: 6px auto 10px; }
.qr-big .qr { width: 100%; display: block; }
.qr-big.used .qr { opacity: .25; }
.stamp { position: absolute; inset: 0; margin: auto; width: 150px; height: 56px; border: 4px solid var(--ok); color: var(--ok); font-weight: 900; font-size: 22px; display: grid; place-items: center; border-radius: 10px; transform: rotate(-12deg); background: rgba(255,255,255,.8); }
.nlist { display: flex; flex-direction: column; gap: 8px; }
.nitem { background: var(--soft); border-radius: 10px; padding: 10px; font-size: 13px; }
.nitem small { display: block; color: var(--muted); margin-top: 2px; }
.p-toasts { position: absolute; top: 42px; left: 10px; right: 10px; z-index: 30; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.p-toasts .toast { background: rgba(28,36,32,.94); color: #fff; border-radius: 16px; padding: 12px 14px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 22px rgba(0,0,0,.25); animation: drop .25s ease-out; }
.page-toasts { position: fixed; top: 74px; right: 18px; z-index: 50; display: flex; flex-direction: column; gap: 8px; width: 360px; pointer-events: none; }
.page-toasts .toast { background: #fff; border-left: 5px solid var(--info); border-radius: 10px; padding: 11px 14px; font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 26px rgba(0,0,0,.15); animation: slide .25s ease-out; }
.toast.t-warn { border-left-color: var(--accent); }
.toast.t-ok { border-left-color: var(--ok); }
.toast.t-muted { border-left-color: #999; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: all .4s; }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }

/* 이동 PX (장병) */
.veh-card { background: #fff; border-radius: 16px; padding: 12px; }
.veh-top { display: flex; justify-content: space-between; align-items: center; }
.veh-sub { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.vpill { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 20px; padding: 3px 9px; background: #eceeed; }
.v-운행 { background: #e2ebff; color: #2650a8; }

  for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }

  const mul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  // 버전별 표 (오류정정 M)

  const MASKS = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x, y) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0,
    (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0,
  ];

  function generator(deg) {
    let poly = [1];
    for (let i = 0; i < deg; i++) {
      const next = new Array(poly.length + 1).fill(0);
      for (let j = 0; j < poly.length; j++) { next[j] ^= poly[j]; next[j + 1] ^= mul(poly[j], EXP[i]); }
      poly = next;
    }
    return poly;
  }

  function remainder(data, gen, deg) {
    let res = new Array(deg).fill(0);
    for (const b of data) {
      const factor = b ^ res[0];
      res = res.slice(1).concat(0);
      for (let i = 0; i < deg; i++) res[i] ^= mul(gen[i + 1], factor);
    }
    return res;
  }

  function penalty(m) {
    const n = m.length;
    let score = 0, dark = 0;
    for (let a = 0; a < n; a++) {
      let rc = null, rl = 0, cc = null, cl = 0;
      for (let b = 0; b < n; b++) {
        const r = m[a][b], c = m[b][a];
        if (r === rc) { rl++; if (rl === 5) score += 3; else if (rl > 5) score++; } else { rc = r; rl = 1; }
        if (c === cc) { cl++; if (cl === 5) score += 3; else if (cl > 5) score++; } else { cc = c; cl = 1; }
        if (r) dark++;
        if (a < n - 1 && b < n - 1 && r === m[a][b + 1] && r === m[a + 1][b] && r === m[a + 1][b + 1]) score += 3;
      }
    }
    return score + Math.max(0, Math.ceil(Math.abs(dark * 20 - n * n * 10) / (n * n)) - 1) * 10;

      if (4 + (ver < 10 ? 8 : 16) + bytes.length * 8 <= cap * 8) break;

    push(4, 4);
    push(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach(b => push(b, 8));
    push(0, Math.min(4, cap * 8 - bits.length));
    push(0, (8 - bits.length % 8) % 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }

    }

    for (let i = 0; i <= shortLen - ecLen; i++) blocks.forEach(b => { if (i < b.dat.length) cw.push(b.dat[i]); });
    for (let i = 0; i < ecLen; i++) blocks.forEach(b => cw.push(b.ecc[i]));

    const size = ver * 4 + 17;

    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }

      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= size || y >= size) continue;
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        set(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = ALIGN[ver], n = al.length;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = mask; // 오류정정 M = 00
      let r = d;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const f = ((d << 10) | r) ^ 0x5412;
      const bit = i => ((f >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let r = ver;
      for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const v = (ver << 12) | r;
      for (let i = 0; i < 18; i++) {
        const b = ((v >>> i) & 1) === 1, a = size - 11 + i % 3, c = Math.floor(i / 3);
        set(a, c, b); set(c, a, b);
      }
    }

    // 데이터 배치 (지그재그)
    let idx = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (!fn[y][x] && idx < cw.length * 8) { mod[y][x] = ((cw[idx >>> 3] >>> (7 - (idx & 7))) & 1) === 1; idx++; }
      }
    }

    // 마스크 선택
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && MASKS[m](x, y)) mod[y][x] = !mod[y][x];
    };
    let best = 0, bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const s = penalty(mod);
      if (s < bestScore) { best = m; bestScore = s; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return mod;
  }

  function svg(text) {
    const m = encode(text), n = m.length, q = 4, full = n + q * 2;
    let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${full} ${full}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="${full}" height="${full}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
  }

  return { encode, svg, _remainder: remainder, _generator: generator };
})();

  const events = [];       // 화면에 토스트로 띄울 이벤트
  const flash = {};        // 재고가 바뀐 품목 (관리자 재고표 깜빡임)

  // 웹 모드에서는 알림·토스트를 Sync가 공유 데이터 변화에서 만들어 모든 기기에 똑같이 띄운다
  function emit(kind, text, extra) { if (!quiet && !saver) events.push(Object.assign({ kind, text }, extra)); }
  const product = id => state.products.find(p => p.id === id);
  const soldier = id => state.soldiers.find(s => s.id === id);
  const order = id => state.orders.find(o => o.id === id);
  const flowOf = o => o.method === 'shuttle' ? SHUTTLE_FLOW : PICKUP_FLOW;

  /* ---------- 상품 상태 (PRD 7.2) ---------- */
  function info(p) {
    const today = U.dateStr(state.now);
    const dday = p.expiry ? U.diffDays(today, p.expiry) : null;
    const dispose = dday !== null && p.stock > 0 && dday <= 1;
    const discount = !dispose && dday !== null && p.stock > 0 && dday <= 7;
    const soldout = p.stock <= 0;
    const low = !dispose && p.stock < p.safety;
    const status = dispose ? '폐기대상' : soldout ? '품절' : discount ? '할인' : low ? '부족' : '정상';
    const price = discount ? Math.round(p.price * (1 - DISCOUNT_RATE) / 10) * 10 : p.price;
    return { dday, dispose, discount, soldout, low, status, price };
  }

  function changeStock(p, delta) { p.stock += delta; flash[p.id] = Date.now(); }

  // 번호는 저장된 데이터에서 이어 붙인다 (여러 기기가 함께 쓰므로 별도 카운터를 두지 않음)
  function addAction(a) {
    const n = state.actions.reduce((m, x) => Math.max(m, +x.id.slice(3) || 0), 0);
    a.id = 'SA-' + String(n + 1).padStart(4, '0');
    state.actions.push(a);
    return a;
  }

  /* ---------- 자동 발주 (PRD 7.1) ---------- */
  function checkAutoOrder(p, at) {
    if (p.stock >= p.safety || info(p).dispose) return null;
    if (state.actions.some(a => a.type === '자동발주' && a.pid === p.id && a.status === '발주중')) return null;
    const a = addAction({
      at: at || state.now, type: '자동발주', pid: p.id, name: p.name, qty: p.optimal - p.stock,
      reason: p.stock === 0 ? `품절 · 안전재고(${p.safety})` : `안전재고(${p.safety}) 미만 · 현재고 ${p.stock}`, status: '발주중',
    });
    emit('admin', `🤖 자동 발주 생성 · ${p.name} ${a.qty}개`, { tone: 'warn' });
    return a;
  }

  function receivePO(id, at, note) {
    const a = state.actions.find(x => x.id === id);
    if (!a || a.status !== '발주중') return;
    const p = product(a.pid);
    a.status = '입고완료';
    a.doneAt = at || state.now;
    changeStock(p, a.qty);
    if (p.shelf) p.expiry = U.addDays(U.dateStr(a.doneAt), p.shelf); // 신규 입고분 유통기한
    addAction({ at: a.doneAt, type: '입고', pid: p.id, name: p.name, qty: a.qty, reason: note || `${a.id} 발주분 입고`, status: '처리완료' });
    emit('admin', `📦 입고 완료 · ${p.name} +${a.qty}`, { tone: 'ok' });
    save();
  }

  function dispose(pid) {
    const p = product(pid);
    if (!info(p).dispose) return;
    const qty = p.stock;
    let pending = state.actions.filter(a => a.type === '폐기' && a.pid === pid && a.status === '처리대기');
    if (!pending.length) pending = [addAction({ at: state.now, type: '폐기', pid, name: p.name, qty, reason: '유통기한 임박 · 판매 중지', status: '처리대기' })];
    pending.forEach(a => { a.status = '처리완료'; a.qty = qty; a.doneAt = state.now; });
    changeStock(p, -qty);
    p.expiry = null;
    emit('admin', `🗑️ 폐기 완료 · ${p.name} ${qty}개`, { tone: 'muted' });
    checkAutoOrder(p);
    save();
  }

  /* ---------- 일일 점검: 익일 입고, 할인·폐기 지정, 자동 발주 ---------- */
  function runDailyCheck(at) {
    const today = U.dateStr(at);
    state.actions
      .filter(a => a.type === '자동발주' && a.status === '발주중' && U.dateStr(a.at) < today)
      .forEach(a => receivePO(a.id, at, `${a.id} 발주분 익일 자동 입고`));
    const has = (type, p) => state.actions.some(a => a.type === type && a.pid === p.id && a.expiry === p.expiry);
    state.products.forEach(p => {
      const i = info(p);
      const dl = i.dday !== null && i.dday <= 0 ? '유통기한 경과' : `유통기한 D-${i.dday}`;
      if (i.discount && !has('할인', p)) {
        addAction({ at, type: '할인', pid: p.id, name: p.name, qty: p.stock, reason: `${dl} · 30% 자동 할인`, status: '처리완료', expiry: p.expiry });
        emit('admin', `🏷️ 자동 할인 적용 · ${p.name} (${dl})`, { tone: 'info' });
      }
      if (i.dispose && !has('폐기', p)) {
        addAction({ at, type: '폐기', pid: p.id, name: p.name, qty: p.stock, reason: `${dl} · 판매 중지(폐기 대상)`, status: '처리대기', expiry: p.expiry });
        emit('admin', `⛔ 폐기 대상 지정 · ${p.name} (${dl})`, { tone: 'warn' });
      }
      checkAutoOrder(p, at);
    });
    const s = stats();
    state.lastCheck = { date: today, at, low: s.low.length, expiring: s.expiring.length };
  }

  function stats() {
    const today = U.dateStr(state.now);
    const orders = state.orders.filter(o => U.dateStr(o.createdAt) === today && o.status !== '취소');
    const low = [], expiring = [];
    state.products.forEach(p => { const i = info(p); if (i.low) low.push(p); if (i.discount || i.dispose) expiring.push(p); });
    return {
      orders, low, expiring,
      sales: orders.reduce((s, o) => s + o.amount, 0),
      pendingPO: state.actions.filter(a => a.type === '자동발주' && a.status === '발주중').length,
      pendingDispose: state.actions.filter(a => a.type === '폐기' && a.status === '처리대기').length,
    };
  }

  /* ---------- 주문 ---------- */
  function nextOrderId(t) {
    const prefix = `ORD-${U.dateStr(t).replace(/-/g, '')}-`;
    const n = state.orders.reduce((m, o) => o.id.startsWith(prefix) ? Math.max(m, +o.id.slice(prefix.length) || 0) : m, 0);
    return prefix + String(n + 1).padStart(4, '0');
  }
  function token() { let s = ''; for (let i = 0; i < 8; i++) s += '0123456789ABCDEF'[Math.floor(Math.random() * 16)]; return s; }

  function makeOrder(o) {
    const id = nextOrderId(o.createdAt), status = o.status || '접수';
    const ord = {
      id, sid: o.sid, items: o.items, amount: o.items.reduce((s, it) => s + it.price * it.qty, 0), pay: o.pay,
      method: o.method, place: o.place, dlvDate: o.dlvDate, slot: o.slot, status,
      createdAt: o.createdAt, history: [{ status, at: o.createdAt }],
      qr: o.method === 'mobile' ? null : `SPX|${id}|${token()}`, // 주문번호 기반 고유 토큰
      receivedAt: null, payId: o.payId || null, split: !!o.split,
    };
    state.orders.push(ord);
    return ord;
  }

  function dayLabel(date) {
    const today = U.dateStr(state.now);
    if (date === today) return '오늘';
    if (date === U.addDays(today, 1)) return '내일';
    if (date === U.addDays(today, -1)) return '어제';
    return U.md(date);
  }
  function placeLabel(o) {
    if (o.method === 'shuttle') return `${o.place} · ${dayLabel(o.dlvDate)} ${U.hm(o.slot)} 회차`;
    if (o.method === 'pickup') return `PX 픽업 · ${dayLabel(o.dlvDate)} ${U.hm(o.slot)}`;
    return `${o.place} · 현장 구매`;
  }
  const itemsText = o => o.items.map(it => `${it.name} x${it.qty}`).join(', ');

  function notify(sid, text) {
    if (quiet || saver) return;
    state.notices.push({ id: ++state.seq.notice, sid, at: state.now, text, read: false });
    emit('soldier', text, { sid });
  }

  function statusNotice(o, s) {
    if (o.method === 'shuttle' && s === '배송중') return `🚐 ${U.hm(o.slot)} 회차 셔틀이 출발했습니다 · ${o.id}`;
    if (o.method === 'shuttle' && s === '창고도착') return `📦 ${o.place.replace(' 무인배송창고', ' 창고')} 도착! QR로 수령하세요 · ${o.id}`;
    if (o.method === 'pickup' && s === '준비중') return `🛍️ PX 픽업대에 상품이 준비되었습니다 · ${o.id}`;
    if (s === '수령완료') return `✅ 수령이 완료되었습니다 · ${o.id}`;
    if (s === '취소') return `↩️ 주문이 취소되었습니다 · ${o.id}`;
    return null;
  }

  // 주문 이력 한 단계에 해당하는 장병 알림 문구 (웹 모드에서 Sync가 사용)
  function noticeFor(o, s) {
    if (o.method === 'mobile') return s === '수령완료' ? `🧾 이동 PX 자동결제 ${U.won(o.amount)} · ${o.id}` : null;
    if (s === '접수') return `💳 결제 완료 · ${o.id} (${placeLabel(o)})`;
    return statusNotice(o, s);
  }

  function setStatus(o, status, at) {
    o.status = status;
    o.history.push({ status, at });
    const msg = statusNotice(o, status);
    if (msg) notify(o.sid, msg);
  }

  // 시연 시각에 맞춰 상태 자동 진행 (셔틀: 회차 30분 전 준비, 정시 출발, 10분 후 창고 도착)
  function autoProgress(o) {
    if (o.method === 'mobile' || o.status === '수령완료' || o.status === '취소') return;
    const t = U.at(o.dlvDate, o.slot), flow = flowOf(o);
    const steps = o.method === 'shuttle'
      ? [['준비중', t - 30 * MIN], ['배송중', t], ['창고도착', t + 10 * MIN]]
      : [['준비중', t - 30 * MIN]];
    steps.forEach(([status, at]) => {
      if (state.now >= at && flow.indexOf(status) > flow.indexOf(o.status)) setStatus(o, status, Math.max(at, o.createdAt));
    });
  }
  const progressOrders = () => state.orders.forEach(autoProgress);

  function placeOrders(sid, groups, pay) {
    for (const g of groups) for (const it of g.items) {
      const p = product(it.pid);
      if (info(p).dispose || p.stock < it.qty) return { error: `${p.name} 재고가 부족합니다 (남은 수량 ${Math.max(0, p.stock)}개)` };
    }
    const payId = 'PAY-' + token();
    const orders = groups.map(g => makeOrder({
      sid, pay, payId, method: g.method, place: g.place, dlvDate: g.dlvDate, slot: g.slot, split: g.split, createdAt: state.now,
      items: g.items.map(it => { const p = product(it.pid); return { pid: p.id, name: p.name, emoji: p.emoji, qty: it.qty, price: info(p).price }; }),
    }));
    const sol = soldier(sid);
    orders.forEach(o => o.items.forEach(it => changeStock(product(it.pid), -it.qty)));
    orders.forEach(o => emit('admin', `🆕 새 주문 ${o.id} · ${sol.rank} ${sol.name} · ${U.won(o.amount)} → 재고 즉시 차감`, { tone: 'info' }));
    orders.forEach(o => o.items.forEach(it => checkAutoOrder(product(it.pid))));
    state.carts[sid] = {};
    orders.forEach(o => notify(sid, `💳 결제 완료 · ${o.id} (${placeLabel(o)})`));
    save();
    return { orders };
  }

  // "다음 단계로" 시연 버튼. 마지막 수령완료는 QR 스캔으로만 처리
  function nextStep(id) {
    const o = order(id);
    if (!o || o.method === 'mobile') return;
    const flow = flowOf(o), i = flow.indexOf(o.status);
    if (i < 0 || i >= flow.length - 2) return;
    setStatus(o, flow[i + 1], state.now);
    save();
  }

  function cancelOrder(id) {
    const o = order(id);
    if (!o || o.status !== '접수') return;
    o.items.forEach(it => changeStock(product(it.pid), it.qty));
    setStatus(o, '취소', state.now);
    emit('admin', `↩️ 주문 취소 ${o.id} · 재고 복원`, { tone: 'muted' });
    save();
  }

  function scan(raw, place) {
    const tok = String(raw || '').trim();
    const o = state.orders.find(x => x.qr && x.qr === tok);
    if (!o) return { ok: false, title: '인식 실패', msg: '등록되지 않은 QR코드입니다.' };
    const sol = soldier(o.sid), who = `${sol.rank} ${sol.name}`;
    const fail = (title, msg) => ({ ok: false, order: o, title, msg });
    if (o.status === '수령완료') return fail('이미 수령된 주문', `${U.stamp(o.receivedAt)}에 수령 완료된 주문입니다.`);
    if (o.status === '취소') return fail('취소된 주문', '취소된 주문은 수령할 수 없습니다.');
    const target = o.method === 'pickup' ? PICKUP_PLACE : o.place;
    if (target !== place) return fail('수령 장소 불일치', `이 주문은 [${target}]에서 수령합니다.`);
    if (o.method === 'shuttle' && o.status !== '창고도착') return fail('아직 도착 전', `현재 상태: ${o.status}. 창고에 도착한 뒤 수령할 수 있습니다.`);
    if (o.method === 'pickup' && o.status === '접수') return fail('상품 준비 전', '픽업대에 상품이 준비되면 수령할 수 있습니다.');
    o.receivedAt = state.now;
    setStatus(o, '수령완료', state.now);
    emit('admin', `✅ 수령완료 ${o.id} · ${who}`, { tone: 'ok' });
    save();
    return { ok: true, order: o, title: '수령 완료', msg: `${who} · ${itemsText(o)}` };
  }

  /* ---------- 장바구니·수령 옵션 ---------- */
  function cart(sid) { return state.carts[sid] || (state.carts[sid] = {}); }
  function addToCart(sid, pid, delta) {
    const c = cart(sid), p = product(pid);
    const q = info(p).dispose ? 0 : Math.max(0, Math.min(p.stock, (c[pid] || 0) + delta));
    if (q === 0) delete c[pid]; else c[pid] = q;
    save();
  }
  function removeFromCart(sid, pid) { delete cart(sid)[pid]; save(); }
  function cartLines(sid) {
    const c = cart(sid);
    return Object.keys(c).map(pid => {
      const p = product(pid), i = info(p);
      if (i.dispose || p.stock <= 0) { delete c[pid]; return null; }
      if (c[pid] > p.stock) c[pid] = p.stock;
      return { p, qty: c[pid], info: i };
    }).filter(Boolean);
  }

  // PRD 7.3: 셔틀 3회차, 회차 30분 전 마감
  function shuttleOptions() {
    const today = U.dateStr(state.now), tm = U.addDays(today, 1), out = [];
    ROUNDS.forEach(r => {
      const closed = state.now >= U.at(today, r.min - 30);
      out.push({ key: `${today}|${r.min}`, label: `오늘 ${r.label}`, sub: closed ? '마감' : `${U.hm(r.min - 30)} 마감`, disabled: closed, today: true });
    });
    ROUNDS.forEach(r => out.push({ key: `${tm}|${r.min}`, label: `내일 ${r.label}`, sub: `${U.hm(r.min - 30)} 마감`, disabled: false, today: false }));
    return out;
  }
  // 픽업: 12:00~21:00, 30분 단위, 지금부터 30분 이후
  function pickupOptions() {
    const today = U.dateStr(state.now), out = [];
    [[today, '오늘'], [U.addDays(today, 1), '내일']].forEach(([d, lbl]) => {
      for (let m = 720; m <= 1260; m += 30) if (U.at(d, m) >= state.now + 30 * MIN) out.push({ key: `${d}|${m}`, label: `${lbl} ${U.hm(m)}` });
    });
    return out;
  }

  /* ---------- 시연 시각 ---------- */
  function setNow(t) {
    if (t <= state.now) return;
    for (;;) {
      const d = U.dateStr(state.now), checkAt = U.at(d, DAILY_CHECK_MIN);
      if (state.lastCheck.date < d && checkAt <= t) {
        state.now = Math.max(state.now, checkAt);
        progressOrders();
        runDailyCheck(state.now);
        continue;
      }
      const nextDay = U.at(U.addDays(d, 1), 0);
      if (t < nextDay) { state.now = t; progressOrders(); break; }
      state.now = nextDay;
      progressOrders();
    }
    save();
  }
  const addMinutes = n => setNow(state.now + n * MIN);
  function nextRound() {
    const today = U.dateStr(state.now);
    const t = ROUNDS.map(r => U.at(today, r.min + 10)).find(x => x > state.now);
    setNow(t || U.at(U.addDays(today, 1), ROUNDS[0].min + 10));
  }
  const nextDay = () => setNow(U.at(U.addDays(U.dateStr(state.now), 1), 480));

  /* ---------- 이동 PX (PRD 16장) ---------- */
  const STOPS = () => SPX_DATA.STOPS;
  function vehEta(stopIdx, round) {
    const v = state.vehicle;
    return SPX_DATA.VEH_ROUNDS[round ?? v.round].min + STOPS()[stopIdx].off;
  }
  function vehDepart() {
    const v = state.vehicle;
    if (v.status === '중지' || v.status === '운행') return null;
    if (v.status === '복귀') {
      if (v.round === 0) v.round = 1; else { v.round = 0; v.day = U.addDays(v.day, 1); }
      v.stopIdx = 0; v.fromIdx = 0; v.status = '대기'; v.battery = 100;
      emit('admin', `🔋 충전 완료 · ${SPX_DATA.VEH_ROUNDS[v.round].label} 회차 출발 대기`, { tone: 'info' });
      save();
      return 'ready';
    }
    v.fromIdx = v.stopIdx;
    v.stopIdx += 1;
    v.status = '운행';
    v.movedAt = Date.now(); // 출발시킨 기기가 닫혀도 다른 기기가 도착 처리할 수 있도록
    v.battery = Math.max(8, v.battery - 6);
    save();
    return 'moving';
  }
  function vehArrive() {
    const v = state.vehicle;
    if (v.status !== '운행') return;
    v.fromIdx = v.stopIdx;
    const stop = STOPS()[v.stopIdx];
    if (v.stopIdx === STOPS().length - 1) {
      v.status = '복귀';
      v.auto = false;
      emit('admin', '🏁 이동 PX 본점 복귀 · 자동 보충 목록 생성', { tone: 'warn' });
    } else {
      v.status = '정차';
      Object.keys(v.alerts).forEach(sid => {
        const s = soldier(sid);
        if (v.alerts[sid] && s && SPX_DATA.BARRACKS_STOP[s.barracks] === v.stopIdx) notify(sid, `🚚 이동 PX가 ${stop.name}에 도착했습니다 (10분 정차)`);
      });
    }
    save();
  }
  function vehStop() {
    const v = state.vehicle;
    if (v.status === '중지') return;
    if (v.status === '운행') vehArrive();
    v.prevStatus = v.status;
    v.status = '중지';
    v.auto = false;
    emit('admin', '⛔ 이동 PX 원격 운행 중지', { tone: 'warn' });
    save();
  }
  function vehResume() {
    const v = state.vehicle;
    if (v.status !== '중지') return;
    v.status = v.prevStatus || '정차';
    v.prevStatus = null;
    emit('admin', '▶️ 이동 PX 운행 재개', { tone: 'ok' });
    save();
  }
  function vehToggleAuto() { state.vehicle.auto = !state.vehicle.auto; save(); }
  function vehToggleAlert(sid) { const a = state.vehicle.alerts; a[sid] = !a[sid]; save(); }
  function replenishList() {
    return state.vehicle.load.map(l => ({ ...l, need: l.std - l.qty, p: product(l.pid) })).filter(l => l.need > 0);
  }
  // 복귀 후 보충: 적재 기준 − 잔량만큼 본점 재고에서 차감 → 안전재고 미만이면 자동 발주
  function vehReplenish() {
    const v = state.vehicle;
    if (v.status !== '복귀' && v.status !== '대기') return;
    replenishList().forEach(l => {
      const p = l.p, give = Math.min(l.need, Math.max(0, p.stock));
      if (!give) return;
      changeStock(p, -give);
      v.load.find(x => x.pid === l.pid).qty += give;
      addAction({ at: state.now, type: '차량보충', pid: p.id, name: p.name, qty: give, reason: `${v.name} 적재 기준 ${l.std} − 잔량 ${l.qty}`, status: '처리완료' });
      checkAutoOrder(p);
    });
    emit('admin', `🚚 ${v.name} 보충 완료 · 본점 재고 차감`, { tone: 'ok' });
    save();
  }
  function mobilePurchase(sid, picks, pay) {
    const v = state.vehicle;
    if (v.status !== '정차') return { error: '차량이 정차 중일 때만 결제할 수 있습니다.' };
    const items = [];
    for (const [pid, qty] of Object.entries(picks)) {
      if (qty <= 0) continue;
      const l = v.load.find(x => x.pid === pid), p = product(pid);
      if (!l || l.qty < qty) return { error: `${p.name} 적재 수량이 부족합니다.` };
      items.push({ pid, name: p.name, emoji: p.emoji, qty, price: p.price });
    }
    if (!items.length) return { error: '꺼낸 상품이 없습니다.' };
    items.forEach(it => { v.load.find(x => x.pid === it.pid).qty -= it.qty; });
    const stop = STOPS()[v.stopIdx];
    const o = makeOrder({ sid, items, pay, method: 'mobile', place: `이동 PX · ${stop.name}`, dlvDate: U.dateStr(state.now), slot: U.minOf(state.now), status: '수령완료', createdAt: state.now });
    o.receivedAt = state.now;
    v.sales.push({ id: o.id, at: state.now, stopIdx: v.stopIdx, sid, amount: o.amount, qty: items.reduce((s, it) => s + it.qty, 0) });
    const sol = soldier(sid);
    emit('admin', `🚚 이동 PX 현장 결제 · ${stop.name} · ${sol.rank} ${sol.name} ${U.won(o.amount)}`, { tone: 'info' });
    notify(sid, `🧾 이동 PX 자동결제 ${U.won(o.amount)} · ${o.id}`);
    save();
    return { order: o };
  }

  /* ---------- 초기 데이터 ---------- */
  function seedOrders() {
    const r = SPX_DATA.rng(1102);
    const today = U.dateStr(state.now), yday = U.addDays(today, -1);
    const sellable = state.products.filter(p => p.stock > 0 && !info(p).dispose);
    const pick = (pool, n) => {
      const out = [];
      while (out.length < n) {
        const p = pool[Math.floor(r() * pool.length)];
        if (!out.some(it => it.pid === p.id)) out.push({ pid: p.id, name: p.name, emoji: p.emoji, qty: 1 + Math.floor(r() * 2), price: info(p).price });
      }
      return out;
    };
    // 시연 계정의 어제 주문 (수령완료) — "내 주문만 보인다" 확인용
    const demo = state.soldiers[0];
    const y = makeOrder({ sid: demo.id, pay: demo.pay, method: 'pickup', place: PICKUP_PLACE, dlvDate: yday, slot: 1230, createdAt: U.at(yday, 1180), items: pick(sellable.filter(p => !p.pickupOnly), 2) });
    y.history.push({ status: '준비중', at: U.at(yday, 1200) }, { status: '수령완료', at: U.at(yday, 1236) });
    y.status = '수령완료';
    y.receivedAt = U.at(yday, 1236);
    // 오늘 다른 장병들의 주문 36건 (현재고는 이미 차감된 값)
    const mins = Array.from({ length: 36 }, () => 510 + Math.floor(r() * 515)).sort((a, b) => a - b);
    mins.forEach(min => {
      const sol = state.soldiers[1 + Math.floor(r() * 99)];
      const shuttle = r() < 0.6;
      const pool = shuttle ? sellable.filter(p => !p.pickupOnly) : sellable;
      const slot = shuttle ? (min < 720 ? 750 : 1080) : Math.min(1260, Math.max(720, Math.ceil((min + 30) / 30) * 30 + 30 * Math.floor(r() * 4)));
      makeOrder({
        sid: sol.id, pay: sol.pay, method: shuttle ? 'shuttle' : 'pickup', place: shuttle ? `${sol.barracks} 무인배송창고` : PICKUP_PLACE,
        dlvDate: today, slot, createdAt: U.at(today, min), items: pick(pool, 1 + Math.floor(r() * 3)),
      });
    });
    progressOrders();
    state.orders.forEach(o => {
      if (o.status === '수령완료') return;
      const due = U.at(o.dlvDate, o.slot);
      const ready = o.status === '창고도착' || (o.method === 'pickup' && o.status === '준비중' && due <= state.now);
      if (ready && r() < 0.75) {
        const at = Math.min(state.now, due + (15 + Math.floor(r() * 60)) * MIN);
        o.receivedAt = at;
        setStatus(o, '수령완료', at);
      }
    });
  }

  function createInitialState() {
    const today = U.dateStr(Date.now());
    state = {
      version: 1,
      epoch: Date.now(), // 초기화할 때마다 바뀜 (다른 기기가 초기화를 알아차리는 기준)
      now: U.at(today, DAILY_CHECK_MIN),
      products: SPX_DATA.buildProducts(today),
      soldiers: SPX_DATA.buildSoldiers(),
      orders: [], actions: [], notices: [], carts: {},
      seq: { order: {}, action: 0, notice: 0 },
      session: { soldierId: null, admin: false },
      lastCheck: null,
      vehicle: {
        name: '이동PX-01', day: today, round: 0, stopIdx: 0, fromIdx: 0, status: '대기', prevStatus: null,
        battery: 100, auto: false, alerts: {}, sales: [],
        load: SPX_DATA.MOBILE_LOAD.map(([pid, std]) => ({ pid, std, qty: std })),
      },
    };
    quiet = true;
    runDailyCheck(state.now);              // 06:00 일일 점검: 자동 발주·할인·폐기 지정
    state.now = U.at(today, 17 * 60 + 10); // 시연 시작: 일과 후 17:10
    seedOrders();
    quiet = false;
    events.length = 0;
  }

  function save() {
    if (saver) { saver(state); return; }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경에서도 시연은 계속 */ } }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (s && s.version === 1) {
        state = s;
        if (state.vehicle.status === '운행') vehArrive();
        return;
      }
    } catch (e) { /* 손상된 저장값은 무시하고 새로 만든다 */ }
    reset();
  }
  function reset() { createInitialState(); save(); }

  function login(id, pin) {
    const s = soldier(String(id).trim());
    if (!s || s.pin !== String(pin).trim()) return false;
    state.session.soldierId = s.id;
    save();
    return true;
  }
  function logout() { state.session.soldierId = null; save(); }
  function adminLogin(id, pin) {
    if (String(id).trim() !== 'admin' || String(pin).trim() !== '0000') return false;
    state.session.admin = true;
    save();
    return true;
  }
  function adminLogout() { state.session.admin = false; save(); }
  function markNoticesRead(sid) { state.notices.forEach(n => { if (n.sid === sid) n.read = true; }); save(); }

  return {
    get state() { return state; }, flash,
    load, save, reset, drain: () => events.splice(0),
    adopt: s => { state = s; }, setSaver: fn => { saver = fn; },
    info, product, soldier, order, stats, flowOf, placeLabel, dayLabel, itemsText, noticeFor,
    login, logout, adminLogin, adminLogout, markNoticesRead,
    cart, cartLines, addToCart, removeFromCart, shuttleOptions, pickupOptions,
    placeOrders, nextStep, cancelOrder, scan, receivePO, dispose,
    addMinutes, nextRound, nextDay,
    vehEta, vehDepart, vehArrive, vehStop, vehResume, vehToggleAuto, vehToggleAlert, replenishList, vehReplenish, mobilePurchase,
  };
})();

</script>
<script>
/* 장병용 모바일 화면 (PRD 8.1 U1~U5 + 16장 이동 PX) */

// 장병·관리자 화면이 함께 쓰는 표시 요소
function statusBadge(s) {
  const cls = { 접수: 'b-gray', 준비중: 'b-blue', 배송중: 'b-amber', 창고도착: 'b-green', 수령완료: 'b-done', 취소: 'b-red' }[s] || 'b-gray';
  return `<span class="sbadge ${cls}">${s}</span>`;
}
function vehStatusLabel(v) {
  return { 대기: '출발 대기', 운행: '이동 중', 정차: '정차 중', 복귀: '본점 복귀', 중지: '운행 중지' }[v.status] || v.status;
}
function routeMapSVG(mine) {
  const v = Store.state.vehicle, ST = SPX_DATA.STOPS, pts = ST.slice(0, ST.length - 1);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x} ${p.y}`).join(' ') + ' Z';
  const from = ST[v.fromIdx], to = ST[v.stopIdx];
  const here = v.status === '운행' ? -1 : v.stopIdx % pts.length;
  return `<svg class="route" viewBox="0 0 380 250" role="img" aria-label="이동 PX 노선도">
    <path d="${d}" class="route-line"/><path d="${d}" class="route-dash"/>
    ${pts.map((p, i) => `<g class="stop${i === mine ? ' mine' : ''}${i === here ? ' here' : ''}"><circle cx="${p.x}" cy="${p.y}" r="8"/><text x="${p.tx}" y="${p.ty}" text-anchor="${p.anchor}">${i === mine ? '★ ' : ''}${p.short}</text></g>`).join('')}
    <g class="veh${v.status === '중지' ? ' stopped' : ''}" data-to="${to.x},${to.y}" style="transform:translate(${from.x}px,${from.y}px)"><circle r="16"/><text y="6" text-anchor="middle">🚚</text></g>
  </svg>`;
}

const SoldierUI = (() => {
  const ui = {
    tab: 'home', cat: '전체', err: '',
    method: 'shuttle', warehouse: null, roundKey: null, pickupKey: null, pay: null,
    payStage: 'form', payingLabel: '', lastIds: [],
    qrId: null, notices: false, mobile: null,
  };
  const st = () => Store.state;
  const me = () => st().session.soldierId ? Store.soldier(st().session.soldierId) : null;
  const bg = p => SPX_DATA.CAT_RULE[p.cat].bg;
  const cartCount = s => Object.values(Store.cart(s.id)).reduce((a, b) => a + b, 0);
  const subHead = (title, back) => `<div class="p-subhead">${back ? `<button class="icon-btn" data-act="s-tab" data-tab="${back}" aria-label="뒤로">‹</button>` : '<span></span>'}<b>${title}</b><span></span></div>`;
  const stepper = (act, pid, q, max) => `<div class="stepper"><button data-act="${act}" data-pid="${pid}" data-d="-1" aria-label="빼기">−</button><b>${q}</b><button data-act="${act}" data-pid="${pid}" data-d="1" ${q >= max ? 'disabled' : ''} aria-label="더하기">＋</button></div>`;

  function resetCheckout() {
    Object.assign(ui, { method: 'shuttle', warehouse: null, roundKey: null, pickupKey: null, pay: null, payStage: 'form', err: '' });
  }

  function render() {
    const s = me();
    if (!s) return loginView();
    const pages = { home: homeView, cart: cartView, pay: payView, orders: ordersView, mobile: mobileView };
    return `<div class="p-app">
      <div class="p-status"><b>${U.time(st().now)}</b><span>LTE ▮▮▮ 🔋</span></div>
      <div class="p-body" data-scroll-key="p-${ui.tab}">${(pages[ui.tab] || homeView)(s)}</div>
      ${navView(s)}${ui.qrId ? qrModal() : ''}${ui.notices ? noticeModal(s) : ''}${ui.mobile ? mobileModal(s) : ''}
    </div>`;
  }

  /* ---------- U1 로그인 ---------- */
  function loginView() {
    const samples = st().soldiers.slice(0, 5);
    return `<div class="p-app"><div class="p-status"><b>${U.time(st().now)}</b><span>LTE ▮▮▮ 🔋</span></div>
      <div class="p-body p-login">
        <div class="login-hero"><div class="logo lg">PX</div><h1>스마트 PX</h1><p>국군 복지몰 · 사전주문 무인수령</p></div>
        <label class="flabel" for="lgId">군번</label>
        <input id="lgId" class="finput" data-bind="lgId" value="${U.esc(Binds.lgId || '')}" placeholder="예) 26-70001234" autocomplete="off">
        <label class="flabel" for="lgPin">PIN (4자리)</label>
        <input id="lgPin" class="finput" data-bind="lgPin" value="${U.esc(Binds.lgPin || '')}" type="password" inputmode="numeric" maxlength="4" placeholder="••••" data-enter="s-login">
        ${ui.err ? `<div class="err">${ui.err}</div>` : ''}
        <button class="btn primary block lg" data-act="s-login">로그인</button>
        <div class="samples"><div class="samples-title">시연용 샘플 계정 (눌러서 입력)</div>
          ${samples.map(s => `<button class="sample" data-act="s-fill" data-id="${s.id}" data-pin="${s.pin}"><span>${s.rank} ${s.name} · ${s.barracks}</span><small>${s.id} / ${s.pin}</small></button>`).join('')}
        </div>
        <p class="fine">모의 인증 · 가상 장병 100명 데이터</p>
      </div></div>`;
  }

  /* ---------- U2 복지몰 홈 ---------- */
  function nextShuttleText() {
    const today = U.dateStr(st().now);
    const r = ROUNDS.find(x => st().now < U.at(today, x.min - 30));
    return r ? `${r.label} (${U.hm(r.min - 30)} 마감)` : '내일 12:30';
  }

  function homeView(s) {
    const unread = st().notices.filter(n => n.sid === s.id && !n.read).length;
    const cats = ['전체', ...SPX_DATA.CATEGORIES];
    const list = st().products.filter(p => !Store.info(p).dispose && (ui.cat === '전체' || p.cat === ui.cat));
    const c = cartCount(s);
    return `<div class="p-head">
        <div><div class="p-hello">${s.rank} ${s.name}님</div><div class="p-sub">${s.barracks} · ${s.id} <button class="link" data-act="s-logout">로그아웃</button></div></div>
        <div class="p-icons">
          <button class="icon-btn" data-act="s-notices" aria-label="알림">🔔${unread ? `<i>${unread}</i>` : ''}</button>
          <button class="icon-btn" data-act="s-tab" data-tab="cart" aria-label="장바구니">🛒${c ? `<i>${c}</i>` : ''}</button>
        </div>
      </div>
      <div class="p-banner"><b>🌙 판매원 부재 · 무인 운영 중</b><span>미리 주문하고 PX 픽업 또는 무인셔틀로 받으세요</span></div>
      <div class="p-chips"><span class="chip">🚐 다음 셔틀 ${nextShuttleText()}</span><span class="chip">🛍️ 픽업 12:00~21:00</span></div>
      <div class="p-cats">${cats.map(k => `<button class="${k === ui.cat ? 'on' : ''}" data-act="s-cat" data-cat="${k}">${k}</button>`).join('')}</div>
      <div class="p-grid">${list.map(p => productCard(p, s)).join('')}</div>`;
  }

  function productCard(p, s) {
    const i = Store.info(p), q = Store.cart(s.id)[p.id] || 0;
    const badges = (p.pickupOnly ? '<span class="bdg pick">픽업전용</span>' : '') + (i.discount ? '<span class="bdg sale">할인 30%</span>' : '') + (i.soldout ? '<span class="bdg out">품절</span>' : '');
    const meta = i.soldout ? '품절 · 입고 예정' : `재고 ${p.stock}개${i.discount ? ` · 유통기한 D-${i.dday}` : ''}`;
    const btn = i.soldout ? '<button class="btn sm block" disabled>품절</button>'
      : q ? stepper('s-qty', p.id, q, p.stock)
        : `<button class="btn sm block primary" data-act="s-qty" data-pid="${p.id}" data-d="1">담기</button>`;
    return `<div class="pcard${i.soldout ? ' soldout' : ''}">
      <div class="pimg" style="background:${bg(p)}"><span>${p.emoji}</span><div class="bdgs">${badges}</div></div>
      <div class="pname">${p.name}</div>
      <div class="pprice">${i.discount ? `<s>${U.won(p.price)}</s>` : ''}<b class="${i.discount ? 'sale' : ''}">${U.won(i.price)}</b></div>
      <div class="pmeta${!i.soldout && p.stock < 5 ? ' few' : ''}">${meta}</div>
      ${btn}
    </div>`;
  }

  /* ---------- U3 장바구니·수령 방식 ---------- */
  // 수령 방식에 따라 주문을 나눈다 (PRD F1-8: 픽업전용 상품은 픽업 주문으로 자동 분리)
  function buildPlan(s, lines) {
    const shOpts = Store.shuttleOptions(), pickOpts = Store.pickupOptions();
    if (!ui.warehouse) ui.warehouse = `${s.barracks} 무인배송창고`;
    const openSh = shOpts.filter(o => !o.disabled);
    if (!openSh.some(o => o.key === ui.roundKey)) ui.roundKey = openSh[0].key;
    if (!pickOpts.some(o => o.key === ui.pickupKey)) ui.pickupKey = pickOpts[0].key;
    const parse = k => { const [d, m] = k.split('|'); return { dlvDate: d, slot: +m }; };
    const group = (method, ls, split) => ({
      method, split,
      place: method === 'shuttle' ? ui.warehouse : PICKUP_PLACE,
      ...parse(method === 'shuttle' ? ui.roundKey : ui.pickupKey),
      items: ls.map(l => ({ pid: l.p.id, qty: l.qty, p: l.p, price: l.info.price })),
      amount: ls.reduce((a, l) => a + l.info.price * l.qty, 0),
    });
    const bulky = lines.filter(l => l.p.pickupOnly), normal = lines.filter(l => !l.p.pickupOnly);
    let groups;
    if (ui.method === 'pickup') groups = [group('pickup', lines, false)];
    else if (!normal.length) groups = [group('pickup', lines, true)];
    else if (bulky.length) groups = [group('shuttle', normal, false), group('pickup', bulky, true)];
    else groups = [group('shuttle', lines, false)];
    return { groups, bulky, shOpts, pickOpts, closedToday: shOpts.some(o => o.today && o.disabled), total: groups.reduce((a, g) => a + g.amount, 0) };
  }
  const groupLabel = g => `${g.method === 'shuttle' ? g.place : 'PX 픽업대'} · ${Store.dayLabel(g.dlvDate)} ${U.hm(g.slot)}${g.method === 'shuttle' ? ' 회차' : ''}`;

  function cartView(s) {
    const lines = Store.cartLines(s.id);
    if (!lines.length) return subHead('장바구니', 'home') + `<div class="empty"><div class="empty-ico">🛒</div><p>장바구니가 비어 있습니다</p><button class="btn primary" data-act="s-tab" data-tab="home">상품 보러 가기</button></div>`;
    const plan = buildPlan(s, lines);
    const lineHtml = lines.map(l => `<div class="cline">
        <div class="cimg" style="background:${bg(l.p)}">${l.p.emoji}</div>
        <div class="cinfo"><div class="cname">${l.p.name}${l.p.pickupOnly ? ' <span class="bdg pick">픽업전용</span>' : ''}${l.info.discount ? ' <span class="bdg sale">할인</span>' : ''}</div>
          <div class="cprice">${U.won(l.info.price)} × ${l.qty} = <b>${U.won(l.info.price * l.qty)}</b></div>
          <div class="cctl">${stepper('s-qty', l.p.id, l.qty, l.p.stock)}<button class="link" data-act="s-remove" data-pid="${l.p.id}">삭제</button></div></div>
      </div>`).join('');
    const pickSel = label => `<label class="flabel">${label}</label><select class="fsel" data-change="s-pickup">${plan.pickOpts.map(o => `<option value="${o.key}"${o.key === ui.pickupKey ? ' selected' : ''}>${o.label}</option>`).join('')}</select>`;
    let opts;
    if (ui.method === 'shuttle') {
      const cur = plan.shOpts.find(o => o.key === ui.roundKey);
      opts = `<label class="flabel">배송지 (생활관별 무인배송창고)</label>
        <select class="fsel" data-change="s-warehouse">${WAREHOUSES.map(w => `<option${w === ui.warehouse ? ' selected' : ''}>${w}</option>`).join('')}</select>
        <label class="flabel">배송 회차 <small>회차 30분 전 주문 마감</small></label>
        <div class="rounds">${plan.shOpts.map(o => `<button class="round${o.key === ui.roundKey ? ' on' : ''}" ${o.disabled ? 'disabled' : ''} data-act="s-round" data-key="${o.key}"><b>${o.label}</b><small>${o.sub}</small></button>`).join('')}</div>
        ${plan.closedToday ? `<div class="note">⏱️ 마감된 회차는 선택할 수 없어 다음 회차(<b>${cur.label}</b>)로 자동 안내합니다.</div>` : ''}
        ${plan.bulky.length ? `<div class="warnbox"><b>📦 픽업전용 상품 자동 분리</b><p>${plan.bulky.map(l => l.p.name).join(', ')}은(는) 부피가 커서 셔틀로 배송하지 않습니다. <b>PX 픽업 주문으로 자동 분리</b>됩니다.</p>${pickSel('분리된 픽업 주문 수령 시간')}</div>` : ''}`;
    } else {
      opts = pickSel('픽업 희망 시간 (12:00~21:00, 30분 단위)') + '<div class="note">🛍️ 판매원이 없어도 PX 픽업대 QR 단말로 수령합니다.</div>';
    }
    return subHead('장바구니', 'home') + `<div class="p-pad">${lineHtml}
        <h4 class="sec">수령 방식</h4>
        <div class="seg">
          <button class="${ui.method === 'shuttle' ? 'on' : ''}" data-act="s-method" data-m="shuttle"><b>🚐 무인셔틀</b><small>생활관 무인배송창고</small></button>
          <button class="${ui.method === 'pickup' ? 'on' : ''}" data-act="s-method" data-m="pickup"><b>🛍️ PX 픽업</b><small>원하는 시간에 픽업대</small></button>
        </div>
        ${opts}
        <h4 class="sec">주문 요약</h4>${summaryBox(plan)}
      </div>
      <div class="p-cta"><button class="btn primary block lg" data-act="s-tab" data-tab="pay">결제하기 · ${U.won(plan.total)}</button></div>`;
  }

  function summaryBox(plan, detail) {
    return `<div class="sumbox">${plan.groups.map((g, i) => `<div class="sumrow">
        <div class="sumtop"><span><span class="tag ${g.method}">${g.method === 'shuttle' ? '셔틀' : '픽업'}</span> 주문 ${i + 1}${g.split ? ' · 자동 분리' : ''}</span><b>${U.won(g.amount)}</b></div>
        <small>${groupLabel(g)}</small>
        ${detail ? `<small class="items">${g.items.map(it => `${it.p.emoji} ${it.p.name} x${it.qty}`).join(' · ')}</small>` : ''}
      </div>`).join('')}<div class="sumtotal"><span>결제 금액</span><b>${U.won(plan.total)}</b></div></div>`;
  }

  /* ---------- U4 결제 ---------- */
  function payView(s) {
    if (ui.payStage === 'done') return payDone();
    if (ui.payStage === 'paying') return subHead('결제') + `<div class="paying"><div class="spinner"></div><b>${ui.payingLabel} 승인 요청 중…</b><small>모의 결제 · 실제 결제는 이루어지지 않습니다</small></div>`;
    const lines = Store.cartLines(s.id);
    if (!lines.length) return cartView(s);
    const plan = buildPlan(s, lines), pay = ui.pay || s.pay;
    const methods = [
      ['나라사랑카드', '💳', `나라사랑카드 ****-${s.id.slice(-4)}`, '본인 명의 등록 카드'],
      ['간편결제', '📲', '군 복지 간편결제', '휴대폰 간편 인증'],
    ];
    return subHead('결제', 'cart') + `<div class="p-pad">
        <h4 class="sec">주문 내역</h4>${summaryBox(plan, true)}
        <h4 class="sec">결제 수단</h4>
        ${methods.map(([k, ico, t, sub]) => `<button class="paym${pay === k ? ' on' : ''}" data-act="s-paymethod" data-m="${k}"><span class="paym-ico">${ico}</span><span class="paym-txt"><b>${t}</b><small>${sub}${s.pay === k ? ' · 기본 결제수단' : ''}</small></span><i class="radio"></i></button>`).join('')}
        ${ui.err ? `<div class="err">${ui.err}</div>` : ''}
        <div class="note">🔒 모의 결제 연계 화면입니다. 결제가 끝나면 주문별 수령용 QR코드가 생성됩니다.</div>
      </div>
      <div class="p-cta"><button class="btn primary block lg" data-act="s-pay">${U.won(plan.total)} 결제하기</button></div>`;
  }

  function payDone() {
    const orders = ui.lastIds.map(Store.order).filter(Boolean);
    return subHead('결제 완료') + `<div class="p-pad center">
        <div class="done-ico">✅</div><h3>결제가 완료되었습니다</h3>
        <p class="muted">${orders.length > 1 ? `픽업전용 상품이 분리되어 주문 ${orders.length}건이 생성되었습니다.` : '수령할 때 아래 QR코드를 단말에 대세요.'}</p>
        ${orders.map(o => `<div class="qrcard">${QR.svg(o.qr)}<div><b>${o.id}</b><small>${Store.placeLabel(o)}</small><small>${Store.itemsText(o)} · ${U.won(o.amount)}</small></div></div>`).join('')}
        <button class="btn primary block" data-act="s-tab" data-tab="orders">내 주문에서 확인</button>
        <button class="btn ghost block" data-act="s-tab" data-tab="home">쇼핑 계속하기</button>
      </div>`;
  }

  /* ---------- U5 내 주문·QR ---------- */
  function ordersView(s) {
    const list = st().orders.filter(o => o.sid === s.id).sort((a, b) => b.createdAt - a.createdAt);
    return subHead('내 주문') + `<div class="p-pad">${list.length ? list.map(orderCard).join('') : '<div class="empty"><div class="empty-ico">🧾</div><p>주문 내역이 없습니다</p></div>'}</div>`;
  }

  function orderCard(o) {
    const flow = Store.flowOf(o), idx = flow.indexOf(o.status);
    const canNext = o.method !== 'mobile' && idx >= 0 && idx < flow.length - 2;
    const ready = (o.method === 'shuttle' && o.status === '창고도착') || (o.method === 'pickup' && o.status === '준비중');
    const steps = o.method === 'mobile' || o.status === '취소' ? ''
      : `<div class="steps">${flow.map((f, i) => `<div class="step${i < idx ? ' done' : i === idx ? ' cur' : ''}"><i></i><span>${f}</span></div>`).join('')}</div>`;
    const tag = o.method === 'shuttle' ? '셔틀' : o.method === 'pickup' ? '픽업' : '현장구매';
    return `<div class="ocard${ready ? ' ready' : ''}${o.status === '취소' ? ' cancelled' : ''}">
      <div class="ohead"><span><span class="tag ${o.method}">${tag}</span> <b>${o.id}</b></span>${statusBadge(o.status)}</div>
      <div class="oitems">${o.items.map(it => `${it.emoji} ${it.name} x${it.qty}`).join(' · ')}</div>
      <div class="ometa">${U.won(o.amount)} · ${o.pay}<br>${Store.placeLabel(o)}</div>
      ${steps}
      ${ready ? `<div class="oready">${o.method === 'shuttle' ? '📦 창고에 도착했습니다. QR로 수령하세요' : '🛍️ 픽업대에 준비되었습니다. QR로 수령하세요'}</div>` : ''}
      ${o.receivedAt ? `<div class="ometa small">수령 ${U.stamp(o.receivedAt)}</div>` : ''}
      <div class="oacts">
        ${o.qr && o.status !== '취소' ? `<button class="btn sm${ready ? ' primary' : ''}" data-act="s-qr" data-id="${o.id}">▦ QR 보기</button>` : ''}
        ${canNext ? `<button class="btn sm ghost" data-act="s-next" data-id="${o.id}" title="시연용 상태 진행">다음 단계로 ▶</button>` : ''}
        ${o.status === '접수' ? `<button class="btn sm danger-ghost" data-act="s-cancel" data-id="${o.id}">주문 취소</button>` : ''}
      </div>
    </div>`;
  }

  function qrModal() {
    const o = Store.order(ui.qrId);
    if (!o) return '';
    const used = o.status === '수령완료';
    return `<div class="p-modal" data-act="s-qr-close"><div class="p-sheet" data-stop>
      <div class="sheet-head"><b>수령용 QR코드</b><button class="icon-btn" data-act="s-qr-close" aria-label="닫기">✕</button></div>
      <div class="qr-big${used ? ' used' : ''}">${QR.svg(o.qr)}${used ? '<div class="stamp">수령완료</div>' : ''}</div>
      <div class="center"><b>${o.id}</b><div class="muted">${Store.placeLabel(o)}</div><div class="mt8">${statusBadge(o.status)}</div>
        <p class="muted small">${o.method === 'pickup' ? 'PX 픽업대' : o.place} 단말에 QR을 대면 수령이 완료됩니다.</p></div>
    </div></div>`;
  }

  function noticeModal(s) {
    const list = st().notices.filter(n => n.sid === s.id).slice().reverse();
    return `<div class="p-modal" data-act="s-notices-close"><div class="p-sheet" data-stop>
      <div class="sheet-head"><b>알림</b><button class="icon-btn" data-act="s-notices-close" aria-label="닫기">✕</button></div>
      <div class="nlist">${list.length ? list.map(n => `<div class="nitem"><span>${n.text}</span><small>${U.stamp(n.at)}</small></div>`).join('') : '<p class="muted center">새 알림이 없습니다</p>'}</div>
    </div></div>`;
  }

  /* ---------- 이동 PX ---------- */
  function mobileView(s) {
    const v = st().vehicle, ST = SPX_DATA.STOPS, mine = SPX_DATA.BARRACKS_STOP[s.barracks], myStop = ST[mine];
    const round = SPX_DATA.VEH_ROUNDS[v.round];
    let eta;
    if (v.status === '중지') eta = '운행이 중지되어 도착 시각을 안내할 수 없습니다.';
    else if (v.status === '정차' && v.stopIdx === mine) eta = `<b>지금 ${myStop.name}에 정차 중!</b> (10분 정차)`;
    else if (v.status === '운행' && v.stopIdx === mine) eta = `<b>곧 도착</b> · 다음 정차지가 ${myStop.name}입니다`;
    else if (v.status === '복귀' || v.stopIdx > mine) eta = v.round === 0 ? `이번 회차는 지나갔습니다 · 다음 회차 <b>${U.hm(Store.vehEta(mine, 1))}</b> 도착 예정` : `오늘 운행이 끝났습니다 · 내일 <b>${U.hm(Store.vehEta(mine, 0))}</b> 도착 예정`;
    else eta = `<b>${mine - v.stopIdx}정거장</b> 남음 · <b>${U.hm(Store.vehEta(mine))}</b> 도착 예정`;
    const alertOn = !!v.alerts[s.id];
    const canOpen = v.status === '정차';
    return subHead('이동 PX') + `<div class="p-pad">
      <div class="veh-card">
        <div class="veh-top"><b>🚚 ${v.name}</b><span class="vpill v-${v.status}">${vehStatusLabel(v)}</span></div>
        <div class="veh-sub">${v.round + 1}회차 ${round.label} 출발 · 현재 <b>${ST[v.stopIdx].name}</b> · 🔋 ${v.battery}%</div>
        ${routeMapSVG(mine)}
      </div>
      ${v.status === '중지' ? '<div class="errbox">⛔ 기상·안전 사유로 운행이 중지되었습니다. 진열장 문 열기가 비활성화됩니다.</div>' : ''}
      <div class="eta-box"><div>★ 내 생활관 앞 (${myStop.name})</div><div>${eta}</div></div>
      <button class="toggle-row" data-act="s-alert"><span>🔔 내 생활관 앞 도착 알림</span><i class="switch${alertOn ? ' on' : ''}"></i></button>
      <h4 class="sec">차량 적재 상품 <small>남은 수량</small></h4>
      <div class="load-grid">${v.load.map(l => { const p = Store.product(l.pid); return `<div class="load-item${l.qty === 0 ? ' empty' : ''}"><span class="li-emo" style="background:${bg(p)}">${p.emoji}</span><span class="li-name">${p.name}</span><small>${U.won(p.price)}</small><b>${l.qty}개</b></div>`; }).join('')}</div>
      <div class="note">차량 측면 단말에 개인 QR을 대면 진열장 문이 열립니다. 꺼낸 상품은 문을 닫을 때 자동 결제됩니다.</div>
    </div>
    <div class="p-cta"><button class="btn primary block lg" data-act="s-m-open" ${canOpen ? '' : 'disabled'}>${canOpen ? '📱 QR로 진열장 문 열기' : v.status === '중지' ? '운행 중지 · 문 열기 불가' : '차량 정차 시 이용 가능'}</button></div>`;
  }

  function mobileModal(s) {
    const m = ui.mobile, v = st().vehicle, stop = SPX_DATA.STOPS[v.stopIdx];
    let body;
    if (m.step === 'qr') {
      body = `<div class="center"><p class="muted">${stop.name} · ${v.name}</p>
        <div class="qr-big">${QR.svg(`SPX-M|${s.id}|${v.name}`)}</div>
        <p>차량 측면 단말에 개인 QR을 대세요</p>
        <button class="btn primary block" data-act="s-m-tag">단말에 태그 (시연)</button></div>`;
    } else if (m.step === 'open') {
      const total = Object.entries(m.picks).reduce((a, [pid, q]) => a + Store.product(pid).price * q, 0);
      body = `<div class="door-open">🔓 진열장 문이 열렸습니다</div>
        <p class="muted small">꺼낸 상품을 선택하세요 (실제 차량은 무게·카메라 센서로 자동 인식)</p>
        <div class="pick-list">${v.load.map(l => { const p = Store.product(l.pid), q = m.picks[l.pid] || 0; return `<div class="pick-row${l.qty === 0 ? ' empty' : ''}"><span>${p.emoji} ${p.name}<small>${U.won(p.price)} · 남은 ${l.qty}개</small></span>${l.qty ? stepper('s-m-qty', l.pid, q, l.qty) : '<small>소진</small>'}</div>`; }).join('')}</div>
        ${m.err ? `<div class="err">${m.err}</div>` : ''}
        <button class="btn primary block lg" data-act="s-m-pay" ${total ? '' : 'disabled'}>🚪 문 닫기 · ${U.won(total)} 자동결제</button>`;
    } else if (m.step === 'paying') {
      body = `<div class="paying"><div class="spinner"></div><b>문 닫힘 · 꺼낸 상품 확인 중…</b><small>${s.pay} 자동결제 (모의)</small></div>`;
    } else {
      const o = Store.order(m.orderId);
      body = `<div class="center"><div class="done-ico">🧾</div><h3>자동결제 완료</h3>
        <p>${Store.itemsText(o)}</p><p><b>${U.won(o.amount)}</b> · ${o.pay}</p>
        <p class="muted small">${o.id} · 내 주문에 현장 구매로 기록되었습니다</p>
        <button class="btn primary block" data-act="s-m-close">확인</button></div>`;
    }
    const closable = m.step !== 'paying';
    return `<div class="p-modal"${closable ? ' data-act="s-m-close"' : ''}><div class="p-sheet tall" data-stop>
      <div class="sheet-head"><b>이동 PX 무인결제</b>${closable ? '<button class="icon-btn" data-act="s-m-close" aria-label="닫기">✕</button>' : ''}</div>${body}</div></div>`;
  }

  function navView(s) {
    const c = cartCount(s);
    const ready = st().orders.filter(o => o.sid === s.id && ((o.method === 'shuttle' && o.status === '창고도착') || (o.method === 'pickup' && o.status === '준비중'))).length;
    const items = [['home', '🏠', '홈', 0], ['cart', '🛒', '장바구니', c], ['orders', '🧾', '내 주문', ready], ['mobile', '🚚', '이동 PX', 0]];
    return `<nav class="p-nav">${items.map(([t, ico, label, n]) => `<button class="${ui.tab === t || (t === 'cart' && ui.tab === 'pay') ? 'on' : ''}" data-act="s-tab" data-tab="${t}"><span>${ico}${n ? `<i>${n}</i>` : ''}</span>${label}</button>`).join('')}</nav>`;
  }

  /* ---------- 동작 ---------- */
  const actions = {
    's-fill': el => { Binds.lgId = el.dataset.id; Binds.lgPin = el.dataset.pin; ui.err = ''; },
    's-login': () => {
      if (!Store.login(Binds.lgId || '', Binds.lgPin || '')) { ui.err = '군번 또는 PIN이 올바르지 않습니다.'; return; }
      Binds.lgPin = '';
      ui.tab = 'home';
      resetCheckout();
    },
    's-logout': () => { Store.logout(); Object.assign(ui, { tab: 'home', qrId: null, notices: false, mobile: null }); },
    's-tab': el => {
      ui.tab = el.dataset.tab;
      ui.notices = false;
      if (ui.tab === 'pay' && ui.payStage !== 'paying') ui.payStage = 'form';
      if (ui.tab !== 'pay') ui.err = '';
    },
    's-cat': el => { ui.cat = el.dataset.cat; },
    's-qty': el => Store.addToCart(me().id, el.dataset.pid, +el.dataset.d),
    's-remove': el => Store.removeFromCart(me().id, el.dataset.pid),
    's-method': el => { ui.method = el.dataset.m; },
    's-round': el => { ui.roundKey = el.dataset.key; },
    's-paymethod': el => { ui.pay = el.dataset.m; },
    's-pay': () => {
      const s = me(), plan = buildPlan(s, Store.cartLines(s.id));
      const groups = plan.groups.map(g => ({ method: g.method, place: g.place, dlvDate: g.dlvDate, slot: g.slot, split: g.split, items: g.items.map(it => ({ pid: it.pid, qty: it.qty })) }));
      const pay = ui.pay || s.pay;
      ui.payStage = 'paying';
      ui.payingLabel = pay;
      ui.err = '';
      setTimeout(() => {
        const res = Store.placeOrders(s.id, groups, pay);
        if (res.error) { ui.payStage = 'form'; ui.err = res.error; } else { ui.payStage = 'done'; ui.lastIds = res.orders.map(o => o.id); }
        App.render();
      }, 1500);
    },
    's-qr': el => { ui.qrId = el.dataset.id; },
    's-qr-close': () => { ui.qrId = null; },
    's-next': el => Store.nextStep(el.dataset.id),
    's-cancel': el => Store.cancelOrder(el.dataset.id),
    's-notices': () => { ui.notices = true; Store.markNoticesRead(me().id); },
    's-notices-close': () => { ui.notices = false; },
    's-alert': () => Store.vehToggleAlert(me().id),
    's-m-open': () => { ui.mobile = { step: 'qr', picks: {}, err: '' }; },
    's-m-tag': () => { ui.mobile.step = 'open'; },
    's-m-qty': el => {
      const m = ui.mobile, l = st().vehicle.load.find(x => x.pid === el.dataset.pid);
      m.picks[l.pid] = Math.max(0, Math.min(l.qty, (m.picks[l.pid] || 0) + +el.dataset.d));
    },
    's-m-pay': () => {
      const s = me(), m = ui.mobile;
      m.step = 'paying';
      setTimeout(() => {
        const res = Store.mobilePurchase(s.id, m.picks, s.pay);
        if (res.error) { m.step = 'open'; m.err = res.error; } else { m.step = 'done'; m.orderId = res.order.id; }
        App.render();
      }, 1200);
    },
    's-m-close': () => { ui.mobile = null; },
  };
  const changes = {
    's-warehouse': el => { ui.warehouse = el.value; },
    's-pickup': el => { ui.pickupKey = el.value; },
  };

  // 시연 가이드 체크 (화면 왼쪽 패널)
  function progress() {
    const sid = st().session.soldierId || st().soldiers[0].id;
    const today = U.dateStr(st().now);
    const mine = st().orders.filter(o => o.sid === sid && U.dateStr(o.createdAt) === today && o.method !== 'mobile');
    return {
      login: !!st().session.soldierId,
      cart: cartCount({ id: sid }) > 0 || mine.length > 0,
      shuttle: mine.some(o => o.method === 'shuttle') || (ui.method === 'shuttle' && cartCount({ id: sid }) > 0 && ['cart', 'pay'].includes(ui.tab)),
      paid: mine.length > 0,
      arrived: mine.some(o => ['창고도착', '수령완료'].includes(o.status) && o.method === 'shuttle'),
      received: mine.some(o => o.status === '수령완료'),
    };
  }

  return { ui, render, actions, changes, progress, resetCheckout };
})();

</script>
<script>
/* 관리자 콘솔 (PRD 8.2 A1~A5 + 16장 이동 PX 관제) */
const AdminUI = (() => {
  const ui = { tab: 'dash', filter: '전체', actType: '전체', roundKey: null, scanSel: null, scanPlace: PICKUP_PLACE, scanning: false, result: null, err: '', cam: null };
  const st = () => Store.state;
  const card = (title, body, opts = {}) => `<section class="card ${opts.cls || ''}"><div class="card-head"><h3>${title}</h3>${opts.right || ''}</div>${body}</section>`;
  const who = sid => { const s = Store.soldier(sid); return s ? `${s.rank} ${s.name}` : sid; };
  const today = () => U.dateStr(st().now);
  const readyOrders = () => st().orders.filter(o => (o.method === 'shuttle' && o.status === '창고도착') || (o.method === 'pickup' && o.status === '준비중'));

  function render() {
    if (!st().session.admin) return loginView();
    const s = Store.stats();
    const nav = [
      ['dash', '📊', '대시보드', 0],
      ['inv', '📦', '재고 현황', s.low.length],
      ['act', '🤖', '발주·재고처리', s.pendingPO + s.pendingDispose],
      ['scan', '📷', 'QR 수령 처리', readyOrders().length],
      ['mobile', '🚚', '이동 PX', 0],
    ];
    const pages = { dash: dashView, inv: invView, act: actView, scan: scanView, mobile: mobileView };
    return `<div class="admin">
      <aside class="a-side">
        <div class="a-brand"><div class="logo">PX</div><div><b>스마트 PX</b><small>관리자 콘솔</small></div></div>
        <nav>${nav.map(([t, ico, label, n]) => `<button class="${ui.tab === t ? 'on' : ''}" data-act="a-tab" data-tab="${t}"><span>${ico}</span><em>${label}</em>${n ? `<i>${n}</i>` : ''}</button>`).join('')}</nav>
        <div class="a-user"><b>PX 관리관</b><small>시범부대 ○○대대</small><button class="link" data-act="a-logout">로그아웃</button></div>
      </aside>
      <div class="a-main" data-scroll-key="a-${ui.tab}">${pages[ui.tab]()}</div>
    </div>`;
  }

  /* ---------- A1 로그인 ---------- */
  function loginView() {
    return `<div class="a-login"><div class="a-login-card">
      <div class="a-brand big"><div class="logo">PX</div><div><b>스마트 PX 관리자</b><small>재고·주문·배송 관리</small></div></div>
      <label class="flabel" for="alId">관리자 ID</label>
      <input id="alId" class="finput" data-bind="alId" value="${U.esc(Binds.alId || '')}" placeholder="admin" autocomplete="off">
      <label class="flabel" for="alPin">PIN</label>
      <input id="alPin" class="finput" type="password" data-bind="alPin" value="${U.esc(Binds.alPin || '')}" maxlength="4" placeholder="••••" data-enter="a-login">
      ${ui.err ? `<div class="err">${ui.err}</div>` : ''}
      <button class="btn primary block lg" data-act="a-login">로그인</button>
      <button class="sample" data-act="a-fill"><span>시연용 관리자 계정 (눌러서 입력)</span><small>admin / 0000</small></button>
    </div></div>`;
  }

  /* ---------- A2 대시보드 ---------- */
  function dashView() {
    const s = Store.stats(), lc = st().lastCheck;
    const byMethod = m => s.orders.filter(o => o.method === m).length;
    const disc = s.expiring.filter(p => Store.info(p).discount).length;
    const kpis = [
      ['🧾', '오늘 주문', `${s.orders.length}건`, `셔틀 ${byMethod('shuttle')} · 픽업 ${byMethod('pickup')} · 이동PX ${byMethod('mobile')}`, ''],
      ['💰', '오늘 매출', U.won(s.sales), `건당 평균 ${U.won(s.orders.length ? Math.round(s.sales / s.orders.length / 10) * 10 : 0)}`, ''],
      ['⚠️', '재고 부족', `${s.low.length}건`, `자동 발주 진행 ${s.pendingPO}건`, 'warn'],
      ['⏰', '유통기한 임박', `${s.expiring.length}건`, `할인 ${disc} · 폐기대상 ${s.expiring.length - disc}`, 'danger'],
    ];
    return `<div class="a-title"><h2>대시보드</h2><span class="muted">${U.md(today())}(${U.dow(today())}) ${U.time(st().now)} 기준</span></div>
      <div class="alert-banner">
        <div class="ab-icon">📢</div>
        <div class="ab-text"><div class="ab-title">일일 재고 알림 <small>${U.stamp(lc.at)} 자동 점검 · 실시간 반영</small></div>
          <div class="ab-body">재고 부족 <b>${s.low.length}건</b> · 유통기한 임박 <b>${s.expiring.length}건</b> · 오늘 주문 <b>${s.orders.length}건</b></div></div>
        <div class="ab-acts"><button class="btn sm" data-act="a-tab" data-tab="inv" data-filter="부족">부족 품목</button><button class="btn sm" data-act="a-tab" data-tab="inv" data-filter="임박">임박 품목</button></div>
      </div>
