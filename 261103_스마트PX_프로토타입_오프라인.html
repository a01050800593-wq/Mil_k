<style>
/* Layout: 상단 바 + (장병 모드) 시연 가이드 | 스마트폰 프레임, (관리자 모드) 좌측 내비 | 작업 영역 */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8ECE6; --ink:#17201B; --muted:#5D6A62; --line:#D3DAD3;
  --accent:#2D6849; --accent-ink:#FFFFFF; --accent-soft:#DCEAE1;
  --amber:#A86A12; --amber-soft:#FAEFD8; --red:#B42318; --red-soft:#FBE4E1; --blue:#1F5DA8; --blue-soft:#E1EAF6;
  --shadow:0 1px 2px rgba(20,30,24,.06),0 8px 24px rgba(20,30,24,.08);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201B; --surface-2:#222B25; --ink:#E6ECE8; --muted:#9AA79F; --line:#2E3931;
  --accent:#62B98C; --accent-ink:#0C1A12; --accent-soft:#1D3A2A;
  --amber:#E2A94A; --amber-soft:#3A2D13; --red:#F0786C; --red-soft:#3C1C19; --blue:#7DAAE8; --blue-soft:#17263B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201B; --surface-2:#222B25; --ink:#E6ECE8; --muted:#9AA79F; --line:#2E3931;
  --accent:#62B98C; --accent-ink:#0C1A12; --accent-soft:#1D3A2A;
  --amber:#E2A94A; --amber-soft:#3A2D13; --red:#F0786C; --red-soft:#3C1C19; --blue:#7DAAE8; --blue-soft:#17263B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.brand b{font-size:16px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.top .spacer{flex:1}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-size:13px;color:var(--muted)}
.ghost.warn{border-color:var(--red);color:var(--red)}
.clock{font-size:12px;color:var(--muted)}

.wrap{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

/* user mode */
.user-stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.guide h2{margin:0 0 4px;font-size:20px;text-wrap:balance}
.guide p{margin:0 0 16px;color:var(--muted);max-width:60ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.steps li.on{background:var(--accent-soft)}
.steps li.done{opacity:.6}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700}
.steps li.on .n{background:var(--accent);color:var(--accent-ink)}
.steps b{display:block;font-size:14px}
.steps span{font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.03em}
.fact b{font-size:15px}

.phone{width:400px;max-width:100%;height:800px;max-height:calc(100vh - 110px);min-height:620px;border-radius:40px;background:#0E1310;padding:12px;box-shadow:var(--shadow);position:sticky;top:76px}
.screen{background:var(--bg);border-radius:30px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.notch{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:11.5px;font-weight:600;background:var(--surface)}
.app-head{background:var(--surface);padding:6px 16px 12px;border-bottom:1px solid var(--line)}
.app-head .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.app-head h3{margin:0;font-size:17px}
.app-head small{color:var(--muted);font-size:12px}
.app-body{flex:1;overflow-y:auto;padding:14px}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 10px}
.tabbar button{border:0;background:transparent;padding:6px 0;font-size:11.5px;color:var(--muted);display:grid;gap:2px;justify-items:center;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.badge-n{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard.out{opacity:.55}
.illu{aspect-ratio:4/3;border-radius:10px;display:grid;place-items:center;font-size:44px;position:relative;overflow:hidden;max-width:100%}
.illu::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 55%)}
.illu span{position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.t-food{background:var(--amber-soft)} .t-drink{background:var(--blue-soft)} .t-living{background:var(--accent-soft)} .t-etc{background:var(--surface-2)}
.tags{display:flex;gap:4px;flex-wrap:wrap;min-height:18px}
.tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;letter-spacing:.02em}
.tag.pick{background:var(--blue-soft);color:var(--blue)}
.tag.sale{background:var(--amber-soft);color:var(--amber)}
.tag.out{background:var(--red-soft);color:var(--red)}
.tag.low{background:var(--surface-2);color:var(--muted)}
.pname{font-size:13px;font-weight:600;line-height:1.3;min-height:34px}
.price{display:flex;align-items:baseline;gap:6px}
.price b{font-size:14px}
.price s{font-size:11.5px;color:var(--muted)}
.stock{font-size:11.5px;color:var(--muted)}
.add{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px;font-weight:600;font-size:12.5px}
.add:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}

/* ---------- 유틸 ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pad=(n,l=2)=>String(n).padStart(l,"0");
const won=n=>n.toLocaleString("ko-KR")+"원";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function hm(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
const DOW="일월화수목금토";
function korDate(d){return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")"}
function dday(p){if(!p.expiry)return null;const e=new Date(p.expiry+"T00:00:00");return Math.round((e-startOfDay(new Date()))/864e5)}
function isToday(ts){return ymd(new Date(ts))===ymd(new Date())}
function salePrice(p){return p.discount?Math.round(p.price*0.7/10)*10:p.price}

function seed(){
  const R=rng(20261102),now=new Date(),today=startOfDay(now);
  const products=PDEF.map((d,i)=>({id:"P"+pad(i+1,3),name:d[0],emoji:d[1],cat:d[2],price:d[3],stock:d[4],
    expiry:d[5]==null?null:ymd(addDays(today,d[5])),shelf:d[6],pickupOnly:!!d[7],safe:CAT[d[2]].safe,target:CAT[d[2]].target,discount:false,disposed:false}));
  const soldiers=[];
  for(let i=0;i<100;i++){
    const yr=i<45?"26":"25";
    const rank=yr==="26"?(i<20?"이병":"일병"):(i<75?"상병":"병장");
    const num=yr+"-7"+pad(Math.floor(1000000+R()*8999999),7);
    const name=i===0?"김민준":SUR[Math.floor(R()*SUR.length)]+GIV[Math.floor(R()*GIV.length)];
    soldiers.push({id:num,name,rank,wh:i===0?"3생활관":WH[i%4],pin:num.slice(-4),pay:R()<.6?"card":"easy",card:pad(Math.floor(R()*9999),4)});
  }
  S={v:1,day:ymd(now),products,soldiers,orders:[],actions:[],seq:{o:0,a:0},session:null,admin:false,cart:{}};
  // 오늘 앞서 들어온 주문 (재고는 이미 반영된 현재고 기준)
  const okP=products.filter(p=>p.stock>3&&!(p.expiry&&dday(p)<=7));
  const startH=7,endMin=Math.max(startH*60+30,now.getHours()*60+now.getMinutes()-10);
  const N=34;
  for(let k=0;k<N;k++){
    const s=soldiers[1+Math.floor(R()*99)];
    const t=new Date(today.getTime()+(startH*60+Math.floor(R()*(endMin-startH*60)))*6e4);
    const items=[];const cnt=1+Math.floor(R()*3);
    for(let j=0;j<cnt;j++){const p=okP[Math.floor(R()*okP.length)];if(items.some(x=>x.pid===p.id))continue;items.push({pid:p.id,qty:1+Math.floor(R()*2),price:p.price})}
    const hasBig=items.some(x=>products.find(p=>p.id===x.pid).pickupOnly);
    const shuttle=!hasBig&&R()<.6;
    const r=R();
    let status=r<.45?"done":r<.6?"wait":r<.75?"prep":(shuttle?(r<.88?"move":"ready"):"ready");
    const o={id:"",sid:s.id,items,total:items.reduce((a,x)=>a+x.price*x.qty,0),pay:s.pay,method:shuttle?"shuttle":"pickup",
      place:shuttle?s.wh+" 무인배송창고":"PX 픽업대",slot:shuttle?("오늘 "+ROUNDS[Math.floor(R()*3)]+" 회차"):("오늘 "+pad(12+Math.floor(R()*9))+":"+(R()<.5?"00":"30")),
      status,created:t.getTime(),received:status==="done"?t.getTime()+36e5:null,locker:status==="done"?1+Math.floor(R()*12):null};
    S.orders.push(o);
  }
  S.orders.sort((a,b)=>a.created-b.created).forEach(o=>{o.id=nextOrderId(o.created)});
  // 자율주행 이동 PX 1호: 1회차 운행 중, 연병장 정차
  const load={},target={};MLOAD.forEach(([pid,q])=>{load[pid]=q;target[pid]=q});
  S.mobile={name:"이동 PX 1호",stop:3,lap:1,auto:false,halted:false,battery:82,load,target,sales:[]};
  [[1,["P021","P009"]],[1,["P028"]],[2,["P001","P024"]],[2,["P007"]],[2,["P031","P022"]],[3,["P010"]]].forEach(([st,ps],k)=>{
    const s=soldiers[10+k*7];const items=ps.map(pid=>({pid,qty:1,price:products.find(p=>p.id===pid).price}));
    items.forEach(x=>load[x.pid]-=x.qty);
    const t=Date.now()-(30-k*4)*6e4;const total=items.reduce((a,x)=>a+x.price,0);
    S.mobile.sales.push({time:t,stop:st,sid:s.id,items,total});
  });
  const check=new Date(today.getTime()+7*36e5);
  evaluate(check.getTime());
  save();
}
function nextOrderId(ts){S.seq.o++;return "ORD-"+ymd(new Date(ts)).replace(/-/g,"")+"-"+pad(S.seq.o,4)}
function addAction(a,ts){S.seq.a++;a.id="SA-"+pad(S.seq.a,4);a.time=ts||Date.now();S.actions.push(a);return a}

/* ---------- 자동 발주·재고처리 규칙 ---------- */
function evaluate(ts){
  const made=[];
  for(const p of S.products){
    const d=dday(p);
    if(d!==null&&d<=1&&!p.disposed&&p.stock>0){
      made.push(addAction({type:"dispose",pid:p.id,qty:p.stock,reason:"유통기한 D-"+Math.max(d,0)+" · 판매 중지",status:"처리완료"},ts));
      p.stock=0;p.disposed=true;p.discount=false;
    }else if(d!==null&&d>=2&&d<=7&&!p.discount&&!p.disposed){
      p.discount=true;
      made.push(addAction({type:"sale",pid:p.id,qty:p.stock,reason:"유통기한 D-"+d+" · 30% 할인",status:"적용중"},ts));
    }
    if(p.stock<p.safe&&!S.actions.some(a=>a.type==="order"&&a.pid===p.id&&a.status==="발주중")){
      made.push(addAction({type:"order",pid:p.id,qty:p.target-p.stock,reason:p.stock===0?"품절 (안전재고 "+p.safe+")":"안전재고("+p.safe+") 미만 · 현재고 "+p.stock,status:"발주중"},ts));
    }
  }
  return made;
}
function status(p){
  if(p.disposed)return["폐기","p-bad"];
  if(p.stock===0)return["품절","p-bad"];
  if(p.stock<p.safe)return["부족","p-prep"];
  if(p.discount)return["할인","p-move"];
  return["정상","p-ready"];
}

/* ---------- 시간대 ---------- */
function pickupSlots(){
  const now=new Date(),out=[];
  for(const dOff of [0,1]){
    const base=addDays(startOfDay(now),dOff);
    for(let m=12*60;m<=21*60;m+=30){
      const t=new Date(base.getTime()+m*6e4);
      if(t.getTime()-now.getTime()<30*6e4)continue;
      out.push({v:(dOff?"내일 ":"오늘 ")+hm(t),label:(dOff?"내일 ":"오늘 ")+hm(t)});
    }
    if(out.length>=6&&dOff===0)break;
  }
  return out;
}
function shuttleRounds(){
  const now=new Date(),out=[];
  for(const dOff of [0,1]){
    const base=addDays(startOfDay(now),dOff);
    for(const r of ROUNDS){
      const [h,mi]=r.split(":").map(Number);
      const t=new Date(base.getTime()+(h*60+mi)*6e4);
      const closed=t.getTime()-now.getTime()<30*6e4;
      const pre=dOff?"내일 ":"오늘 ";
      out.push({v:pre+r+" 회차",label:pre+r+" 회차"+(closed?" · 마감":" · "+hm(new Date(t.getTime()-30*6e4))+" 마감"),closed});
    }
    if(dOff===0&&out.some(x=>!x.closed))break;
  }
  return out;
}

function plan(){

function myStopIdx(){const s=me();return s?STOPS.findIndex(x=>x.name.startsWith(s.wh)):-1}
function schedTime(i){
  const m=S.mobile;let lap=m.lap-1;if(i<m.stop)lap++;
  const base=LAPS[Math.min(lap,LAPS.length-1)]||LAPS[0];const [h,mi]=base.split(":").map(Number);
  const t=h*60+mi+STOPS[i].off+(lap>=LAPS.length?24*60:0);
  return (lap>=LAPS.length?"내일 ":"")+pad(Math.floor(t/60)%24)+":"+pad(t%60);
}

function advanceVehicle(quiet){
  const m=S.mobile;if(m.halted)return;
  m.stop=(m.stop+1)%STOPS.length;
  if(m.stop===0){m.lap=Math.min(m.lap+1,LAPS.length+1)}
  m.battery=Math.max(5,m.battery-2);save();
  const my=S.session?myStopIdx():-1;
  if(V.notify&&m.stop===my)toast("이동 PX 도착 알림",STOPS[my].name+"에 도착했습니다. 10분간 정차합니다");
  else if(!quiet)toast(m.name,STOPS[m.stop].name+" 정차");
}

  '<div class="panel"><h3>자동 발주 <small>발주중 '+po.filter(a=>a.status==="발주중").length+'건</small></h3><div class="tbl-wrap"><table><thead><tr><th>처리번호</th><th>상품</th><th class="r">발주 수량</th><th>사유</th><th>생성</th><th>상태</th><th></th></tr></thead><tbody>'+
  (po.length?po.map(a=>{const p=P(a.pid);return '<tr><td class="mono" style="font-size:12px">'+a.id+'</td><td><div class="pn">'+illu(p,"mini")+esc(p.name)+'</div></td><td class="r num"><b>'+a.qty+'</b></td><td class="muted">'+esc(a.reason)+'</td><td class="num muted">'+hm(new Date(a.time))+'</td><td><span class="pill '+(a.status==="발주중"?"p-move":"p-ready")+'">'+a.status+'</span></td><td>'+(a.status==="발주중"?'<button class="btn sm" data-act="receive" data-v="'+a.id+'">입고 처리</button>':'')+'</td></tr>'}).join(""):'<tr><td colspan="7" class="muted">발주 내역이 없습니다.</td></tr>')+'</tbody></table></div></div>'+
  '<div class="panel"><h3>할인·폐기·입고 기록</h3><div class="tbl-wrap"><table><thead><tr><th>처리번호</th><th>유형</th><th>상품</th><th class="r">수량</th><th>사유</th><th>시각</th></tr></thead><tbody>'+
  other.map(a=>{const p=P(a.pid);const m={sale:["할인","ft-sale"],dispose:["폐기","ft-dis"],in:["입고","ft-in"],load:["차량 보충","ft-in"]}[a.type];return '<tr><td class="mono" style="font-size:12px">'+a.id+'</td><td><span class="ftype '+m[1]+'">'+m[0]+'</span></td><td><div class="pn">'+illu(p,"mini")+esc(p.name)+'</div></td><td class="r num">'+a.qty+'</td><td class="muted">'+esc(a.reason)+'</td><td class="num muted">'+hm(new Date(a.time))+'</td></tr>'}).join("")+'</tbody></table></div></div>';
}
function adminOrders(){
  const list=S.orders.slice().sort((a,b)=>{const r=x=>x.status==="ready"?0:x.status==="done"?2:1;return r(a)-r(b)||b.created-a.created});
  return '<div class="ph"><div><h2>주문·수령 처리</h2><p>창고·픽업대 단말 역할입니다. 주문번호를 입력하거나 장병 화면의 QR을 스캔해 수령을 확정합니다.</p></div></div>'+
  '<div class="panel"><h3>QR 수령 단말</h3><div class="scanrow"><input id="scan-in" class="mono" placeholder="주문번호 입력 (예: '+(list[0]?list[0].id:"ORD-…")+')" autocomplete="off"><button class="btn sm" data-act="scanin">QR 스캔 / 수령 처리</button></div></div>'+
  '<div class="panel"><h3>오늘 주문 <small>'+list.length+'건</small></h3><div class="tbl-wrap"><table><thead><tr><th>주문번호</th><th>장병</th><th>상품</th><th>수령</th><th>시간</th><th class="r">금액</th><th>상태</th><th></th></tr></thead><tbody>'+
  list.map(o=>{const s=S.soldiers.find(x=>x.id===o.sid);const it=o.items.map(x=>P(x.pid).emoji).join(" ");
    return '<tr><td class="mono" style="font-size:12px">'+o.id+'</td><td style="white-space:nowrap">'+esc(s.rank+" "+s.name)+'</td><td>'+it+'</td><td style="white-space:nowrap">'+placeLabel(o)+'</td><td class="num" style="white-space:nowrap">'+esc(o.slot.replace(" 회차",""))+'</td><td class="r num">'+won(o.total)+'</td><td>'+stPill(o)+'</td><td style="white-space:nowrap">'+(o.status==="done"?"":(o.status==="ready"?'<button class="btn sm" data-act="scan" data-v="'+o.id+'">수령 처리</button>':'<button class="btn sm sec" data-act="advance" data-v="'+o.id+'">다음 단계</button>'))+'</td></tr>'}).join("")+'</tbody></table></div></div>';
}

/* ---------- 동작 ---------- */
function advance(id){
  const o=S.orders.find(x=>x.id===id);if(!o||o.status==="done")return;
  const f=flow(o),i=f.indexOf(o.status);
  if(f[i+1]==="done"){openScan(id);return}
  o.status=f[i+1];save();
  const msg={prep:"상품을 준비하고 있습니다",move:"무인셔틀이 출발했습니다",ready:o.method==="shuttle"?o.place+"에 도착했습니다":"픽업대에 준비되었습니다"}[o.status];
  toast(o.id.slice(-4)+"번 주문",msg);render();
}
function openScan(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const page=V.mode==="admin";
  if(o.status!=="ready"){V.overlay={kind:"scan",id,step:"notready",page};render();return}
  V.overlay={kind:"scan",id,step:"scanning",page};render();
  setTimeout(()=>{o.status="done";o.received=Date.now();o.locker=1+Math.floor(Math.random()*12);save();V.overlay={kind:"scan",id,step:"done",page};render()},1400);
}
function checkout(){
  const pl=plan(),s=me();
  V.overlay={kind:"paying"};render();
  setTimeout(()=>{
    const ids=[];
    for(const o of pl){
      for(const x of o.items){const p=P(x.pid);p.stock=Math.max(0,p.stock-x.qty)}
      const ord={id:nextOrderId(Date.now()),sid:s.id,items:o.items,total:o.items.reduce((a,x)=>a+x.price*x.qty,0),pay:V.pay,method:o.method,place:o.place,slot:o.slot,status:"wait",created:Date.now(),received:null,locker:null};
      S.orders.push(ord);ids.push(ord.id);
    }
    const made=evaluate();
    S.cart={};save();
    V.newIds=ids;V.overlay=null;V.user="orders";render();
    toast("결제 완료","수령 QR "+ids.length+"개가 생성되었습니다");
    made.filter(a=>a.type==="order").forEach(a=>toast("관리자 알림 · 자동 발주",P(a.pid).name+" "+a.qty+"개 (안전재고 미만)"));
  },1500);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a!=="reset"&&V.resetArm){V.resetArm=false}
  switch(a){
    case"mode":V.mode=v;V.overlay=null;break;
    case"reset":if(!V.resetArm){V.resetArm=true;render();setTimeout(()=>{if(V.resetArm){V.resetArm=false;render()}},4000);return}
      V.resetArm=false;try{localStorage.removeItem(KEY)}catch(e){}seed();Object.assign(V,{user:"login",admin:"dash",cat:"all",method:"pickup",wh:"",newIds:[],overlay:null,notify:false});toast("초기화 완료","시연 데이터를 처음 상태로 되돌렸습니다");break;
    case"login":{
      const id=document.getElementById("lg-id").value.trim(),pin=document.getElementById("lg-pin").value.trim();
      const s=S.soldiers.find(x=>x.id===id);
      if(!s){V.loginErr="등록되지 않은 군번입니다. 아래에서 시연용 계정을 골라 주세요.";break}
      if(s.pin!==pin){V.loginErr="PIN이 맞지 않습니다. 군번 끝 4자리를 입력해 주세요.";break}
      S.session=s.id;V.loginErr="";V.user="mall";V.wh=s.wh;V.pay=s.pay;V.newIds=[];save();break}
    case"logout":S.session=null;S.cart={};V.user="login";V.newIds=[];save();break;
    case"go":V.user=v;if(v!=="orders")V.newIds=[];break;
    case"cat":V.cat=v;break;
    case"add":{const p=P(v);if(!p||p.stock===0)return;S.cart[v]=Math.min(p.stock,(S.cart[v]||0)+1);save();break}
    case"qty":{const p=P(v);const n=(S.cart[v]||0)+(+b.dataset.d);if(n<=0)delete S.cart[v];else S.cart[v]=Math.min(p.stock,n);save();break}
    case"method":V.method=v;break;
    case"pay":V.pay=v;break;
    case"checkout":checkout();return;
    case"advance":advance(v);return;
    case"scan":openScan(v);return;
    case"close":V.overlay=null;break;
    case"mnotify":V.notify=!V.notify;if(V.notify)toast("도착 알림 설정",STOPS[myStopIdx()].name+"에 도착하면 알려 드립니다");break;
    case"mopen":if(S.mobile.halted)return;V.overlay={kind:"mobile",step:"scan",take:{}};render();
      setTimeout(()=>{if(V.overlay&&V.overlay.kind==="mobile"&&V.overlay.step==="scan"){V.overlay.step="open";render()}},1300);return;
    case"mtake":{const ov=V.overlay;if(!ov)return;const n=(ov.take[v]||0)+(+b.dataset.d);ov.take[v]=Math.max(0,Math.min(S.mobile.load[v],n));break}
    case"mclose":{const ov=V.overlay,m=S.mobile,s=me();
      const items=Object.entries(ov.take).filter(([,q])=>q>0).map(([pid,qty])=>({pid,qty,price:P(pid).price}));if(!items.length)return;
      items.forEach(x=>m.load[x.pid]-=x.qty);
      const total=items.reduce((a,x)=>a+x.price*x.qty,0),now=Date.now();
      m.sales.push({time:now,stop:m.stop,sid:s.id,items,total});
      S.orders.push({id:nextOrderId(now),sid:s.id,items,total,pay:s.pay,method:"mobile",place:m.name+" · "+STOPS[m.stop].name,slot:"현장 구매 "+hm(new Date(now)),status:"done",created:now,received:now,locker:null});
      save();ov.step="paid";break}
    case"mnext":advanceVehicle();break;
    case"mauto":S.mobile.auto=!S.mobile.auto;save();toast(S.mobile.name,S.mobile.auto?"자동 운행을 시작합니다 (시연: 12초마다 다음 정차지)":"자동 운행을 멈췄습니다");break;
    case"mhalt":{const m=S.mobile;m.halted=!m.halted;if(m.halted)m.auto=false;save();toast(m.name,m.halted?"운행을 중지했습니다. 차량이 안전하게 정차합니다":"운행을 재개합니다");break}
    case"mrefill":{const m=S.mobile;const made=[];
      Object.keys(m.target).forEach(pid=>{const p=P(pid),n=Math.min(m.target[pid]-m.load[pid],p.stock);if(n>0){p.stock-=n;m.load[pid]+=n;addAction({type:"load",pid,qty:n,reason:m.name+" 복귀 보충 · 본점 재고 "+p.stock,status:"처리완료"})}});
      m.stop=0;m.battery=100;
      evaluate().filter(a=>a.type==="order").forEach(a=>toast("관리자 알림 · 자동 발주",P(a.pid).name+" "+a.qty+"개 (본점 재고 보충분)"));
      save();toast(m.name,"본점 복귀, 보충과 충전을 마쳤습니다");break}
    case"adminlogin":{const id=document.getElementById("ad-id").value.trim(),pin=document.getElementById("ad-pin").value.trim();
      if(id!=="pxadmin"||pin!=="0000"){V.adminErr="ID 또는 PIN이 맞지 않습니다. 시연용 계정은 pxadmin / 0000입니다.";break}
      S.admin=true;V.adminErr="";V.admin="dash";save();break}
    case"adminlogout":S.admin=false;save();break;
    case"anav":V.admin=v;break;
    case"sfilter":V.stockFilter=v;break;
    case"receive":{const ac=S.actions.find(x=>x.id===v);if(!ac)return;const p=P(ac.pid);
      p.stock+=ac.qty;ac.status="입고완료";
      if(p.disposed||p.discount){p.disposed=false;p.discount=false;if(p.shelf)p.expiry=ymd(addDays(new Date(),p.shelf))}
      addAction({type:"in",pid:p.id,qty:ac.qty,reason:ac.id+" 발주분 입고 · 현재고 "+p.stock,status:"처리완료"});
      evaluate();save();toast("입고 완료",p.name+" "+ac.qty+"개 · 현재고 "+p.stock+"개");break}
    case"scanin":{const val=document.getElementById("scan-in").value.trim().toUpperCase();
      const o=S.orders.find(x=>x.id===val||x.id.endsWith(val)&&val.length>=4);
      if(!o){toast("주문을 찾을 수 없습니다","주문번호를 다시 확인해 주세요");return}
      if(o.status==="done"){toast("이미 수령한 주문입니다",o.id);return}
      openScan(o.id);return}
    default:return;
  }
  render();
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="lg-pick"&&el.value){const s=S.soldiers.find(x=>x.id===el.value);document.getElementById("lg-id").value=s.id;document.getElementById("lg-pin").value=s.pin;return}
  if(el.dataset.bind){V[el.dataset.bind]=el.value;render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){if(e.target.id==="lg-pin"||e.target.id==="lg-id")document.querySelector('[data-act="login"]').click();
    if(e.target.id==="ad-pin")document.querySelector('[data-act="adminlogin"]').click();
    if(e.target.id==="scan-in")document.querySelector('[data-act="scanin"]').click();}
  if(e.key==="Escape"&&V.overlay&&V.overlay.kind==="scan"&&V.overlay.step!=="scanning"){V.overlay=null;render()}
});
function tick(){const d=new Date();document.getElementById("clock").textContent=korDate(d)+" "+hm(d)}

S=load();if(!S)seed();
if(S.session){V.user="mall";const s=me();if(s){V.wh=s.wh;V.pay=s.pay}else S.session=null}
// 하루가 지나 유통기한이 바뀐 경우 반영
if(evaluate().length)save();
tick();setInterval(tick,30000);
setInterval(()=>{if(!S.mobile.auto||S.mobile.halted)return;advanceVehicle(true);
  const a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"))return;
  if(V.overlay&&V.overlay.kind==="mobile")return;render()},12000);
render();
})();
</script>
